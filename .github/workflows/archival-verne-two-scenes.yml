name: One-time original 1873 engraving intake (checksum verified)
on:
  push:
    branches: [main]
    paths:
      - tools/intake_verne_two_plates.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical image encoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Download and authenticate both old book scans
        run: python tools/intake_verne_two_plates.py
      - name: Preserve verified image files even if main has advanced
        uses: actions/upload-artifact@v4
        with:
          name: lingua-two-original-1873-scenes
          path: |
            app/src/main/assets/art/verne-fix-watch-1873.webp
            app/src/main/assets/art/verne-passepartout-train-1873.webp
            docs/literature/HISTORIC_VERNES_ASSETS.json
          if-no-files-found: error
      - name: Commit verified old engravings (fast-forward only)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lingua Tales Source Archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/art/verne-fix-watch-1873.webp \
                  app/src/main/assets/art/verne-passepartout-train-1873.webp \
                  docs/literature/HISTORIC_VERNES_ASSETS.json
          git commit -m 'assets(verne): import two SHA-1 verified 1873 archive scenes'
          git push origin HEAD:main
