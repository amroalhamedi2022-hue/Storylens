name: Literature historic images - isolated acquisition
on:
  push:
    branches:
      - content/literature-image-network-fix-20261105
    paths:
      - 'tools/fetch_historic_plate_batch.py'
      - '.github/workflows/literature-image-intake.yml'
      - 'docs/literature/VERNE_FOUR_ADDITIONAL_PLATES_QUEUE.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literature-plate-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  obtain-original-scans:
    if: github.ref == 'refs/heads/content/literature-image-network-fix-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image identification dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Acquire four verified edition images, quarantine ONLY
        run: python tools/fetch_historic_plate_batch.py
      - name: Archive original scans if push permission is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-verne-1873-scans
          path: docs/literature/staging/verne-period-plates-20261105/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit acquired binaries and original-source checksums
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/literature/staging/verne-period-plates-20261105/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new original image files"
          else
            git commit -m "Content: stage 4 authentic 1873 Verne scans and SHA-256 records"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
