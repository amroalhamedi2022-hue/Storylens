name: Lingua Tales - ingest authentic Commons Verne engravings
on:
  push:
    branches:
      - content/verne-commons-plate-collection-20261105
      - main
    paths:
      - 'tools/intake_verne_commons_period_gallery.py'
      - '.github/workflows/verne-commons-period-art-intake.yml'
  schedule:
    - cron: '14 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-historic-commons-serial
  cancel-in-progress: false

jobs:
  acquire-real-archival-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded image/archive decoder
        run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Download up to 18 unique genuinely historic scans with source hashes
        id: acquire
        run: python tools/intake_verne_commons_period_gallery.py --max-new 18
      - name: Preserve authentic Verne scans and hand off fresh inventory to the central audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/literature/staging/verne-commons-period-plates ]; then
            git add -f docs/literature/staging/verne-commons-period-plates/
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new verified source images; no redundant source commit."
          else
            # Commit only evidence-backed images and source manifest.
            # Do NOT use [skip ci]: central chapter-art-progress.yml must be
            # triggered by the staged-image push to regenerate the report.
            git commit -m "Literature: checkpoint authentic Verne Commons scans"
          fi
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "SHA-audited chapter inventory is owned by chapter-art-progress.yml."
      - name: Keep inspectable art and attribution records if repository push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-verne-commons-historic-plates-quarantine
          path: docs/literature/staging/verne-commons-period-plates/
          if-no-files-found: warn
          retention-days: 30
