name: Lingua Tales - Monte Cristo original chapter picture map
on:
  push:
    branches:
      - content/monte-cristo-chapter-art-20261105
      - main
    paths:
      - 'tools/map_monte_cristo_chapter_art.py'
      - '.github/workflows/monte-cristo-chapter-art.yml'
  schedule:
    - cron: '28 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-historic-commons-serial
  cancel-in-progress: false

jobs:
  verified-monte-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.2
      - name: Verify 117 original chapter headings and selected illustration SHA256
        shell: bash
        run: |
          set -euo pipefail
          python tools/map_monte_cristo_chapter_art.py --write
          python tools/map_monte_cristo_chapter_art.py --verify
      - name: Checkpoint genuine picture-to-chapter map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/literature/staging/user-requested-classics-20261105/the-count-of-monte-cristo/chapter-image-map.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Map unchanged; no duplicate commit"
          else
            git commit -m 'Literature: checkpoint 117 original chapter slots and historical local plate candidates [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Retain generated map for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monte-cristo-original-chapter-card-candidates
          path: docs/literature/staging/user-requested-classics-20261105/the-count-of-monte-cristo/chapter-image-map.json
          if-no-files-found: warn
          retention-days: 30
