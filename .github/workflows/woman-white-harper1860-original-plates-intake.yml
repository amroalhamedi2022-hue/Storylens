name: Lingua Tales - extract authentic 1860 John McLenan illustrated book images
on:
  push:
    branches: [content/woman-white-1860-harper-mclenan-original-plates-20261110, main]
    paths:
      - 'tools/intake_woman_white_harper1860_mclenan.py'
      - 'tools/test_woman_white_harper1860_mclenan.py'
      - '.github/workflows/woman-white-harper1860-original-plates-intake.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lingua-mclenan-1860-image-intake-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-sha-audit-and-extract-actual-1860-engraved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF scan/image source tools
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 pymupdf==1.26.5 opencv-python-headless==4.12.0.88
      - name: Reject invented thumbnails and wrong publisher PDF sources
        run: python tools/test_woman_white_harper1860_mclenan.py
      - name: Download SHA-authentic 278-page 1860 volume and stage up to 100 strictly flagged unreviewed illustration-region candidates
        run: python tools/intake_woman_white_harper1860_mclenan.py --max-new 100 --start 8 --stop 278
      - name: Commit ONLY actual original scan pixel crops, preserving failed-page checkpoints
        if: always()
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          folder=docs/literature/staging/woman-white-mclenan-1860-original-scan
          if [ -d "$folder" ]; then
            git add -f "$folder"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new genuine pixel crops; no repeat."
          else
            git commit -m "Literature: archive SHA-pinned real 1860 McLenan source scan crops, visual approval pending"
            saved=0
            for attempt in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              python tools/test_woman_white_harper1860_mclenan.py
              if git push origin "HEAD:$GITHUB_REF_NAME"; then saved=1; break; fi
              sleep 3
            done
            if [ "$saved" -ne 1 ]; then
              echo "::error::Genuine image crops retained in artifact but push failed"
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" = main ]; then
              gh workflow run chapter-art-progress.yml --ref main --repo "$GITHUB_REPOSITORY"
            fi
          fi
      - name: Preserve actual source crop evidence even if public scan is temporarily unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-1860-harper-mclenan-scan-crops-unreviewed
          path: docs/literature/staging/woman-white-mclenan-1860-original-scan/
          if-no-files-found: ignore
          retention-days: 30
