name: Lingua Tales - acquire original 1906 War of the Worlds engravings
on:
  push:
    branches:
      - content/war-worlds-original-1906-art-20261105
      - main
    paths:
      - 'tools/intake_war_worlds_correa_period_gallery.py'
      - '.github/workflows/war-worlds-original-1906-art.yml'
  schedule:
    - cron: '26 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lingua-war-correa-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-correa-original-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Acquire up to 18 genuine 1906 original period art images safely
        run: python tools/intake_war_worlds_correa_period_gallery.py --max-new 18
      - name: Preserve authentic Correa scans and hand off fresh inventory to the central audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/literature/staging/war-of-worlds-correa-period-plates ]; then
            git add -f docs/literature/staging/war-of-worlds-correa-period-plates/
          fi
          git diff --cached --check
          changed=0
          if git diff --cached --quiet; then
            echo "No new verified source images; no redundant source commit."
          else
            # Commit only evidence-backed images and source manifest.
            # Do NOT use [skip ci]: central chapter-art-progress.yml must be
            # triggered by the staged-image push to regenerate the report.
            changed=1
            git commit -m "Literature: checkpoint authentic 1906 Correa scans"
          fi
          if [ "$changed" -eq 1 ]; then
            # Other independent source writers may push concurrently.
            # Retry ordinary fast-forward races without rewriting history.
            saved=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin "$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then saved=1; break; fi
              sleep 2
            done
            if [ "$saved" -ne 1 ]; then
              echo "::error::Verified images committed locally but remote push still failing"
              exit 1
            fi
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              # GITHUB_TOKEN-created pushes do not trigger downstream push
              # workflows. Explicit workflow_dispatch is required.
              gh workflow run chapter-art-progress.yml --ref main --repo "$GITHUB_REPOSITORY"
            fi
          else
            echo "No new source content; scheduled daily central audit remains active."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Retain original archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correa-1906-original-war-of-worlds-staged-art
          path: docs/literature/staging/war-of-worlds-correa-period-plates/
          if-no-files-found: warn
          retention-days: 30
