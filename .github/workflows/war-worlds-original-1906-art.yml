name: Lingua Tales - acquire original 1906 War of the Worlds engravings
on:
  push:
    branches:
      - content/war-worlds-original-1906-art-20261105
      - main
    paths:
      - 'tools/intake_war_worlds_correa_period_gallery.py'
      - '.github/workflows/war-worlds-original-1906-art.yml'
  schedule:
    - cron: '26 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-historic-commons-serial
  cancel-in-progress: false

jobs:
  archive-correa-original-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Acquire up to 18 genuine 1906 original period art images safely
        run: python tools/intake_war_worlds_correa_period_gallery.py --max-new 18
      - name: Preserve authentic Correa scans and regenerate progress after Git reconciliation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/literature/staging/war-of-worlds-correa-period-plates ]; then
            git add -f docs/literature/staging/war-of-worlds-correa-period-plates/
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new source binaries; do not commit duplicate art."
          else
            git commit -m "Literature: checkpoint authentic 1906 Correa scans [skip ci]"
          fi
          # Reconcile SOURCE FILES before generating the snapshot. A previous
          # runner generated progress before pulling concurrent main changes,
          # causing a report add/add conflict, even after 18 real downloads.
          git pull --rebase origin "$GITHUB_REF_NAME"
          # The report is regenerated from the reconciled set of actual image
          # files. Failure to compute a report must NOT discard verified scans.
          report_status=0
          python tools/report_chapter_art_progress.py --write || report_status=$?
          if [ "$report_status" -eq 0 ]; then
            git add docs/literature/CHAPTER_ART_PROGRESS.json docs/literature/CHAPTER_ART_PROGRESS.md
            git diff --cached --check
            if ! git diff --cached --quiet; then
              git commit -m "Literature: refresh audited chapter-art inventory after image intake [skip ci]"
            fi
          else
            echo "::warning::Progress audit failed; source images will still be preserved"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
          if [ "$report_status" -ne 0 ]; then
            echo "::error::Source images saved, but audit requires correction"
            exit "$report_status"
          fi
      - name: Retain original archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correa-1906-original-war-of-worlds-staged-art
          path: docs/literature/staging/war-of-worlds-correa-period-plates/
          if-no-files-found: warn
          retention-days: 30
