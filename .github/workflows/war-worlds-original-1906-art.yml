name: Lingua Tales - acquire original 1906 War of the Worlds engravings
on:
  push:
    branches:
      - content/war-worlds-original-1906-art-20261105
      - main
    paths:
      - 'tools/intake_war_worlds_correa_period_gallery.py'
      - '.github/workflows/war-worlds-original-1906-art.yml'
  schedule:
    - cron: '26 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-historic-commons-serial
  cancel-in-progress: false

jobs:
  archive-correa-original-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Acquire up to 18 genuine 1906 original period art images safely
        run: python tools/intake_war_worlds_correa_period_gallery.py --max-new 18
      - name: Refresh real per-chapter art coverage after source acquisition
        if: always()
        run: python tools/report_chapter_art_progress.py --write
      - name: Save proven source art and hashes even after partial network issues
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d docs/literature/staging/war-of-worlds-correa-period-plates ]; then
            git add -f docs/literature/staging/war-of-worlds-correa-period-plates
            git add docs/literature/CHAPTER_ART_PROGRESS.json docs/literature/CHAPTER_ART_PROGRESS.md
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new original scans; no false completion commit"
          else
            git commit -m 'Literature: retain newly acquired real 1906 Correa images with Commons licensing leads and SHA256 [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Retain original archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correa-1906-original-war-of-worlds-staged-art
          path: docs/literature/staging/war-of-worlds-correa-period-plates/
          if-no-files-found: warn
          retention-days: 30
