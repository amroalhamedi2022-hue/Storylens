name: Lingua Tales - original edition chapter image backfill
on:
  push:
    branches:
      - content/archived-five-chapter-map-20261105
      - main
    paths:
      - 'tools/map_archived_five_chapter_art.py'
      - 'tools/report_chapter_art_progress.py'
      - '.github/workflows/archived-chapter-art-maps.yml'
  schedule:
    - cron: '9 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-historic-commons-serial
  cancel-in-progress: false

jobs:
  verify-original-chapters-and-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch being audited
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Setup Python and HTML original-edition parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned source HTML parser
        run: python -m pip install 'beautifulsoup4==4.14.2'
      - name: Extract all genuine chapter headings and verify selected image binaries
        run: |
          set -euo pipefail
          python tools/map_archived_five_chapter_art.py --write
          python tools/map_archived_five_chapter_art.py --verify
      - name: Checkpoint genuine chapter maps, rebase, then calculate the current main inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve the source-linked chapter map before touching the shared report.
          git add docs/literature/staging/illustrated-five-20261105/*/chapter-image-map.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source chapter maps already present; no duplicate map commit."
          else
            git commit -m "Literature: checkpoint source-anchored historical chapter maps [skip ci]"
          fi
          # A previous implementation committed a report from stale checkout
          # and then rebased it over concurrent archival intake, causing conflicts.
          git pull --rebase origin "$GITHUB_REF_NAME"
          python tools/map_archived_five_chapter_art.py --verify
          python tools/report_chapter_art_progress.py --write
          git add docs/literature/CHAPTER_ART_PROGRESS.json docs/literature/CHAPTER_ART_PROGRESS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Audited report unchanged; no redundant report commit."
          else
            git commit -m "Literature: refresh SHA-audited chapter-art progress after map reconciliation [skip ci]"
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Retain chapter maps even if push blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-original-classics-chapter-image-candidates
          path: |
            docs/literature/staging/illustrated-five-20261105/*/chapter-image-map.json
            docs/literature/CHAPTER_ART_PROGRESS.md
            docs/literature/CHAPTER_ART_PROGRESS.json
          if-no-files-found: warn
          retention-days: 30
