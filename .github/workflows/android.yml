name: Android APK • validate • unit tests
on:
  push:
    branches: [main, automation/storylens-dictionary-saved-words-20261023]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest branch build is useful; avoid consuming CI minutes for
# intermediate source edits in the same functional milestone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android components using runner SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build verified offline dictionary pack (GPL-2.0-or-later data)
        run: |
          python3 tools/build_freedict.py --fetch
          node --check app/src/main/assets/freedict-en-ar.js
          python3 tools/test_freedict.py
      - name: Validate curated offline content
        run: |
          python3 tools/validate_catalog.py
          python3 tools/check_js.py
          python3 tools/test_lingua_launcher.py
          node tools/botanical-theme.test.cjs
          node tools/rain-glass.test.cjs
          node tools/solar-atelier.test.cjs
          node tools/ink-workshop.test.cjs
          node tools/ambience.test.cjs
          node tools/celestial-atlas.test.cjs
          node tools/circuit-notebook.test.cjs
          node tools/terracotta-gallery.test.cjs
          node tools/monochrome-zine.test.cjs
          node tools/chapter-search.test.cjs
          node tools/paragraph-roving.test.cjs
          node tools/keyboard-lookup.test.cjs
          node tools/phrase-lookup.test.cjs
          node tools/locale-journeys.test.cjs
          node --check app/src/main/assets/lexicon-extra.js
          node tools/lexicon.test.cjs
          node tools/freedict.test.cjs
          node tools/editorial.test.cjs
          node tools/editorial-c.test.cjs
          node tools/salt-meridian.test.cjs
          node tools/verne-towle.test.cjs
          node tools/verne-chronology.test.cjs
          node tools/verne-towle-ch05.test.cjs
          node tools/verne-towle-ch06.test.cjs
          node tools/verne-towle-ch07.test.cjs
          node tools/chapter-navigation.test.cjs
          node tools/inline-illustrations.test.cjs
          node tools/assets.test.cjs
          node tools/library-experience.test.cjs
          node tools/bookmark-navigation.test.cjs
          node tools/semantic-bookmarks.test.cjs
          node tools/reader-experience.test.cjs
          node tools/story-transitions.test.cjs
          node tools/data-backup.test.cjs
      - name: Run tests and assemble installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify required files really exist inside APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/APK_SHA256.txt
          for file in index.html lexicon-extra.js liquid-aurora.css lingua-lookup.js reader-experience.js reader-experience.css editorial-stories-a.js editorial-stories-b.js editorial-stories-c.js novella-salt-meridian.js classic-verne-towle-ch01.js classic-verne-towle-ch02.js classic-verne-towle-ch03.js classic-verne-towle-ch04.js classic-verne-towle-ch05.js classic-verne-towle-ch06.js classic-verne-towle-ch07.js lingua-chapter-navigation.js editorial-art.js library-experience.js library-experience.css data-backup.js data-backup.css lingua-shell.js lingua-shell.css lingua-ambience.js lingua-i18n.js freedict-en-ar.js LICENSE_FREEDICT.txt; do
            unzip -Z1 "$APK" | grep -Fqx "assets/$file" || { echo "MISSING assets/$file"; exit 1; }
          done
          # This purposeful build checks that Android AAPT2 compiled the new
          # adaptive launcher XML, rather than trusting source XML alone.
          unzip -Z1 "$APK" | grep -Fqx "res/mipmap-anydpi-v26/ic_launcher.xml" || {
            echo "FAIL: adaptive icon not packaged"; exit 1;
          }
          echo "PASS: adaptive launcher resource and all critical offline modules packaged into $APK"
      - name: Browser render smoke and screenshot artifacts
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome missing; screenshots skipped"; exit 0; fi
          mkdir -p qa-screenshots
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=1280,840 --screenshot="$PWD/qa-screenshots/library-tablet.png" "file://$PWD/app/src/main/assets/index.html" >/tmp/chrome-tablet.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/library-phone.png" "file://$PWD/app/src/main/assets/index.html" >/tmp/chrome-phone.log 2>&1
          file qa-screenshots/*.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4500 --dump-dom "file://$PWD/app/src/main/assets/index.html" > /tmp/storylens-dom.html 2>/tmp/chrome-dom.log
          grep -Fq 'storylens-hero' /tmp/storylens-dom.html || { echo 'Library hero failed to render'; exit 1; }
          echo "PASS: desktop-browser library render smoke"
          python3 tools/make_browser_fixtures.py
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/reader-phone.png" "file://$PWD/app/src/main/assets/qa-reader.html" >/tmp/chrome-reader.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/word-phone.png" "file://$PWD/app/src/main/assets/qa-word.html" >/tmp/chrome-word.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/backup-phone.png" "file://$PWD/app/src/main/assets/qa-backup.html" >/tmp/chrome-backup.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=6500 --dump-dom "file://$PWD/app/src/main/assets/qa-flow.html" > /tmp/storylens-flow-dom.html 2>/tmp/chrome-flow.log
          grep -Fq 'data-storylens-qa="PASS"' /tmp/storylens-flow-dom.html || { echo "E2E journey failed:"; grep -o 'data-storylens-qa-errors="[^"]*"' /tmp/storylens-flow-dom.html | head -1; exit 1; }
          echo "PASS: full reader / word sheet / chapter / bookmark / translation / theme functional journey"
      - name: Upload UI screenshot evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryLens-UI-Screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryLens-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/APK_SHA256.txt
          if-no-files-found: error
