name: Android APK • validate • unit tests
on:
  push:
    branches: [main, automation/storylens-dictionary-saved-words-20261023]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

# Only the newest branch build is useful; avoid consuming CI minutes for
# intermediate source edits in the same functional milestone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android components using runner SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found"; exit 1; fi
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build verified offline dictionary pack (GPL-2.0-or-later data)
        run: |
          python3 tools/build_freedict.py --fetch
          node --check app/src/main/assets/freedict-en-ar.js
          python3 tools/test_freedict.py
      - name: Fetch and verify pinned CC-BY offline audio
        run: python3 tools/fetch_licensed_audio.py
      - name: Validate curated offline content
        run: |
          python3 tools/validate_catalog.py
          python3 tools/check_js.py
          python3 tools/test_lingua_launcher.py
          python3 tools/test_lingua_audio_focus.py
          node tools/botanical-theme.test.cjs
          node tools/rain-glass.test.cjs
          node tools/solar-atelier.test.cjs
          node tools/ink-workshop.test.cjs
          node tools/ambience.test.cjs
          node tools/licensed-audio.test.cjs
          node tools/theme-catalog.test.cjs
          node tools/celestial-atlas.test.cjs
          node tools/circuit-notebook.test.cjs
          node tools/terracotta-gallery.test.cjs
          node tools/monochrome-zine.test.cjs
          node tools/chapter-search.test.cjs
          node tools/paragraph-roving.test.cjs
          node tools/keyboard-lookup.test.cjs
          node tools/phrase-lookup.test.cjs
          node tools/locale-journeys.test.cjs
          node tools/locale-shell.test.cjs
          node tools/typography-profiles.test.cjs
          node tools/content-loader.test.cjs
          node tools/library-shell-layout.test.cjs
          node --check app/src/main/assets/lexicon-extra.js
          node tools/lexicon.test.cjs
          node tools/freedict.test.cjs
          node tools/editorial.test.cjs
          node tools/editorial-c.test.cjs
          node tools/salt-meridian.test.cjs
          node tools/verne-towle.test.cjs
          node tools/verne-chronology.test.cjs
          node tools/verne-towle-ch05.test.cjs
          node tools/verne-towle-ch06.test.cjs
          node tools/verne-towle-ch07.test.cjs
          node tools/verne-towle-ch08.test.cjs
          node tools/verne-towle-ch09.test.cjs
          node tools/verne-towle-ch10.test.cjs
          node tools/verne-towle-ch12.test.cjs
          node tools/verne-towle-ch13.test.cjs
          node tools/verne-towle-ch14.test.cjs
          node tools/verne-towle-ch15.test.cjs
          node tools/verne-towle-ch16.test.cjs
          node tools/verne-towle-ch17.test.cjs
          node tools/verne-towle-ch18.test.cjs
          node tools/verne-towle-ch19.test.cjs
          node tools/verne-towle-ch20.test.cjs
          node tools/verne-towle-ch21.test.cjs
          node tools/verne-towle-ch22.test.cjs
          node tools/verne-towle-ch23.test.cjs
          node tools/verne-towle-ch24.test.cjs
          node tools/verne-towle-ch25.test.cjs
          node tools/verne-towle-ch26.test.cjs
          node tools/verne-towle-ch27.test.cjs
          node tools/verne-towle-ch28.test.cjs
          node tools/verne-towle-ch29.test.cjs
          node tools/verne-towle-ch30.test.cjs
          node tools/verne-towle-ch31.test.cjs
          node tools/verne-towle-ch33.test.cjs
          node tools/verne-towle-ch35.test.cjs
          node tools/verne-towle-ch36.test.cjs
          node tools/verne-towle-ch37.test.cjs
          node tools/verne-complete-novel.test.cjs
          node tools/chapter-navigation.test.cjs
          node tools/inline-illustrations.test.cjs
          node tools/assets.test.cjs
          node tools/library-experience.test.cjs
          node tools/bookmark-navigation.test.cjs
          node tools/semantic-bookmarks.test.cjs
          node tools/reader-experience.test.cjs
          node tools/contextual-page-turn.test.cjs
          node tools/story-transitions.test.cjs
          node tools/data-backup.test.cjs
      - name: Run tests and assemble installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify required files really exist inside APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/APK_SHA256.txt
          for file in index.html lexicon-extra.js liquid-aurora.css lingua-lookup.js reader-experience.js reader-experience.css editorial-stories-a.js editorial-stories-b.js editorial-stories-c.js novella-salt-meridian.js classic-verne-towle-ch01.js classic-verne-towle-ch02.js classic-verne-towle-ch03.js classic-verne-towle-ch04.js classic-verne-towle-ch05.js classic-verne-towle-ch06.js classic-verne-towle-ch07.js classic-verne-towle-ch08.js classic-verne-towle-ch09.js classic-verne-towle-ch10.js classic-verne-towle-ch11.js classic-verne-towle-ch12.js classic-verne-towle-ch13.js classic-verne-towle-ch14.js classic-verne-towle-ch15.js classic-verne-towle-ch16.js classic-verne-towle-ch17.js classic-verne-towle-ch18.js classic-verne-towle-ch19.js classic-verne-towle-ch20.js classic-verne-towle-ch21.js classic-verne-towle-ch22.js classic-verne-towle-ch23.js classic-verne-towle-ch24.js classic-verne-towle-ch25.js classic-verne-towle-ch26.js classic-verne-towle-ch27.js classic-verne-towle-ch28.js classic-verne-towle-ch29.js classic-verne-towle-ch30.js classic-verne-towle-ch31.js classic-verne-towle-ch33.js classic-verne-towle-ch34.js classic-verne-towle-ch35.js classic-verne-towle-ch36.js classic-verne-towle-ch37.js lingua-chapter-navigation.js lingua-content-loader.js editorial-art.js editorial-art-ch35.js editorial-art-ch36.js editorial-art-ch37.js reform-club-countdown.css library-experience.js library-experience.css data-backup.js data-backup.css lingua-shell.js lingua-shell.css lingua-ambience.js lingua-licensed-audio.js lingua-i18n.js LICENSE_AUDIO.txt freedict-en-ar.js LICENSE_FREEDICT.txt; do
            unzip -Z1 "$APK" | grep -Fqx "assets/$file" || { echo "MISSING assets/$file"; exit 1; }
          done
          test "$(find app/src/main/assets/licensed-audio -maxdepth 1 -type f -name '*.ogg' | wc -l)" -eq 20 || { echo "Expected 20 pinned licensed audio files"; exit 1; }
          for file in app/src/main/assets/licensed-audio/*.ogg; do
            name="$(basename "$file")"
            unzip -Z1 "$APK" | grep -Fqx "assets/licensed-audio/$name" || { echo "MISSING licensed audio $name inside APK"; exit 1; }
          done
          unzip -Z1 "$APK" | grep -Fqx "assets/licensed-audio/manifest.json" || { echo "MISSING licensed audio manifest"; exit 1; }
          unzip -Z1 "$APK" | grep -Fqx "assets/LICENSE_AUDIO.txt" || { echo "MISSING CC-BY attribution"; exit 1; }
          # This purposeful build checks that Android AAPT2 compiled the new
          # adaptive launcher XML, rather than trusting source XML alone.
          unzip -Z1 "$APK" | grep -Fqx "res/mipmap-anydpi-v26/ic_launcher.xml" || {
            echo "FAIL: adaptive icon not packaged"; exit 1;
          }
          echo "PASS: adaptive launcher resource and all critical offline modules packaged into $APK"
      - name: Browser render smoke and screenshot artifacts
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome missing; screenshots skipped"; exit 0; fi
          mkdir -p qa-screenshots
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=1280,840 --screenshot="$PWD/qa-screenshots/library-tablet.png" "file://$PWD/app/src/main/assets/index.html" >/tmp/chrome-tablet.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/library-phone.png" "file://$PWD/app/src/main/assets/index.html" >/tmp/chrome-phone.log 2>&1
          file qa-screenshots/*.png
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=4500 --dump-dom "file://$PWD/app/src/main/assets/index.html" > /tmp/storylens-dom.html 2>/tmp/chrome-dom.log
          grep -Fq 'storylens-hero' /tmp/storylens-dom.html || { echo 'Library hero failed to render'; exit 1; }
          echo "PASS: desktop-browser library render smoke"
          python3 tools/make_browser_fixtures.py
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=18000 --dump-dom "file://$PWD/app/src/main/assets/qa-lazy-content.html" > /tmp/storylens-lazy-content-dom.html 2>/tmp/chrome-lazy-content.log
          grep -Fq 'data-lt-lazy-qa="PASS"' /tmp/storylens-lazy-content-dom.html || { echo "Deferred offline content QA failed:"; grep -o 'data-lt-lazy-qa-errors="[^"]*"' /tmp/storylens-lazy-content-dom.html | head -1; exit 1; }
          echo "PASS: Chromium confirms long-book and FreeDict payloads are loaded only on demand"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=4500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/reader-phone.png" "file://$PWD/app/src/main/assets/qa-reader.html" >/tmp/chrome-reader.log 2>&1
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=460,860 --screenshot="$PWD/qa-screenshots/verne14-phone.png" "file://$PWD/app/src/main/assets/qa-verne14.html" >/tmp/chrome-verne14.log 2>&1
