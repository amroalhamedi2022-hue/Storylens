name: Android APK • validate • unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Use Android SDK preinstalled on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
      - name: Install required SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Validate curated offline content
        run: python3 tools/validate_catalog.py
      - name: Run tests and assemble installable APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoryLens-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
