name: Literature five unabridged illustrated works - actual acquisition
on:
  push:
    branches:
      - content/literature-image-network-fix-20261105
    paths:
      - 'tools/intake_five_complete_illustrated_books.py'
      - '.github/workflows/literature-five-illustrated-ingest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-sourced-illustrated-novels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest-five-full-originals:
    if: github.ref == 'refs/heads/content/literature-image-network-fix-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install literature-only source and image readers
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'Pillow==11.3.0'
      - name: Download five complete original texts and every edition image, verify and commit each
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for book in treasure-island kidnapped the-black-arrow the-last-of-the-mohicans the-gilded-age; do
            echo "::group::Acquire full illustrated edition: $book"
            python tools/intake_five_complete_illustrated_books.py --book "$book"
            python tools/intake_five_complete_illustrated_books.py --book "$book" --verify
            git add -f "docs/literature/staging/illustrated-five-20261105/$book"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "Already staged; no duplicate commit for $book"
            else
              git commit -m "Literature: archive COMPLETE $book original and all locally anchored historical illustrations"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
            echo "::endgroup::"
          done
          python tools/intake_five_complete_illustrated_books.py --verify
          echo "FIVE COMPLETE ORIGINAL ENGLISH EDITIONS WITH VERIFIED LOCAL HISTORIC IMAGE BINARY FILES STAGED."
          echo "NOT A RELEASE; Arabic bilingual translations, rights and reader integration remain pending."
      - name: Retain original edition staging if GitHub push blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-complete-original-books-and-period-art
          path: docs/literature/staging/illustrated-five-20261105/
          if-no-files-found: warn
          retention-days: 21
