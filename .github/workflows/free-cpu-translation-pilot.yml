name: Lingua Tales - free CPU translation pilot (no API)
on:
  push:
    branches: [automation/free-cpu-translation-pilot-20261127]
    paths:
      - 'docs/automation/cpu_translation_pilot.py'
      - '.github/workflows/free-cpu-translation-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingua-cpu-translation-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source alignment and local guard tests
        run: |
          python docs/automation/cpu_translation_pilot.py --self-test
          node tools/export_verne_chapter.cjs 1 --check
      - name: Install bounded CPU runtime
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers==4.53.3' 'sentencepiece==0.2.0' 'sacremoses==0.1.1'
      - name: Translate eight authentic source paragraphs locally
        run: python docs/automation/cpu_translation_pilot.py --chapter 1 --limit 8
      - name: Keep small review-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: lingua-cpu-translation-pilot
          path: cpu-translation-evidence/pilot.json
          retention-days: 1
          if-no-files-found: error
