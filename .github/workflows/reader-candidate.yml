name: Installed Android reader and paper evidence
on:
  push:
    branches: [qa/hybrid-reader-evidence-20261121]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lingua-Tales-Preview-NOT-PRODUCTION-UPDATE
          run-id: 44874099789
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: |
          unzip -oq baseline/app-debug.apk 'assets/licensed-audio/*' assets/LICENSE_AUDIO.txt assets/LICENSE_FREEDICT.txt assets/freedict-en-ar.js -d /tmp/bundled
          cp -r /tmp/bundled/assets/. app/src/main/assets/
          gradle --no-daemon :app:assembleDebug
          npm install --prefix /tmp/paper-audio playwright@1.56.1 --no-audit --no-fund
          CHROME=$(command -v google-chrome) NODE_PATH=/tmp/paper-audio/node_modules node tools/paper-motion-audio-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-preview
          path: app/build/outputs/apk/debug/app-debug.apk
  paper:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        direction: [ltr, rtl]
        layout: [portrait, spread]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-preview
          path: apk
      - run: |
          npm install --prefix /tmp/sheet playwright@1.56.1 --no-audit --no-fund
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p android-sheet-evidence
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 3072
          cores: 2
          emulator-options: -no-window -gpu off -feature -Vulkan -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: |
            adb install -r apk/app-debug.apk
            ANDROID_LAYOUT=${{ matrix.layout }} ANDROID_DIRECTION=${{ matrix.direction }} NODE_PATH=/tmp/sheet/node_modules node tools/android-sheet-acceptance.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.direction }}-${{ matrix.layout }}
          path: android-sheet-evidence
