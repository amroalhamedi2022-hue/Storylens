name: Lingua Tales - chapter-image progress audit
on:
  push:
    branches: [main]
    paths:
      - 'docs/literature/CHAPTER_IMAGE_CONTRACT.md'
      - 'docs/literature/HISTORIC_VERNES_ASSETS.json'
      - 'docs/literature/staging/**'
      - 'app/src/main/assets/art/**'
      - 'tools/report_chapter_art_progress.py'
      - '.github/workflows/chapter-art-progress.yml'
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-chapter-art-progress-main
  cancel-in-progress: false

jobs:
  verified-chapter-art-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate verified progress from newest main and retry concurrent source pushes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This workflow is the ONLY automated writer of progress MD/JSON.
          # The archive/mapping jobs commit source evidence and dispatch this
          # workflow explicitly; GITHUB_TOKEN source pushes cannot chain CI.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # Regenerate only from files physically present on latest main.
            python tools/test_staged_original_chapter_indexes.py
            python tools/report_chapter_art_progress.py --write
            git add docs/literature/CHAPTER_ART_PROGRESS.json docs/literature/CHAPTER_ART_PROGRESS.md
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "Latest main already has matching SHA-audited report."
              exit 0
            fi
            git commit -m "Literature: refresh checksum-audited chapter-image coverage [skip ci]"
            if git push origin HEAD:main; then
              echo "Committed audit from current verified source inventory."
              exit 0
            fi
            echo "::warning::main advanced while measuring; audit latest image files again"
            sleep 2
          done
          echo "::error::Could not publish fresh image inventory after bounded retries"
          exit 1
      - name: Upload snapshot for handoff even if branch push unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingua-chapter-art-progress-snapshot
          path: |
            docs/literature/CHAPTER_ART_PROGRESS.json
            docs/literature/CHAPTER_ART_PROGRESS.md
          if-no-files-found: warn
          retention-days: 30
