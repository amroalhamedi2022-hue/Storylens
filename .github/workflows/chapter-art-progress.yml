name: Lingua Tales - chapter-image progress audit
on:
  push:
    branches: [main]
    paths:
      - 'docs/literature/CHAPTER_IMAGE_CONTRACT.md'
      - 'docs/literature/HISTORIC_VERNES_ASSETS.json'
      - 'docs/literature/staging/**'
      - 'app/src/main/assets/art/**'
      - 'tools/report_chapter_art_progress.py'
      - '.github/workflows/chapter-art-progress.yml'
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-chapter-art-progress-main
  cancel-in-progress: false

jobs:
  verified-chapter-art-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure real chapter card coverage and verify all archived image hashes
        run: python tools/report_chapter_art_progress.py --write
      - name: Commit only changed progress snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/literature/CHAPTER_ART_PROGRESS.json docs/literature/CHAPTER_ART_PROGRESS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Progress counts unchanged; no redundant commit."
          else
            git commit -m "Literature: refresh checksum-audited chapter-image coverage [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload snapshot for handoff even if branch push unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingua-chapter-art-progress-snapshot
          path: |
            docs/literature/CHAPTER_ART_PROGRESS.json
            docs/literature/CHAPTER_ART_PROGRESS.md
          if-no-files-found: warn
          retention-days: 30
