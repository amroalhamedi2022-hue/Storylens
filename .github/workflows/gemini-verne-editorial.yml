name: Lingua Tales - resumable Gemini chapter production
on:
  push:
    branches:
      - main
      - content/gemini-verne-resumable-editorial-20261105
    paths:
      - 'tools/export_verne_chapter.cjs'
      - 'tools/gemini_verne_editorial.py'
      - '.github/workflows/gemini-verne-editorial.yml'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lingua-tales-gemini-verne-editorial
  cancel-in-progress: false

jobs:
  verify-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout original literature source
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # Full commit ancestry is necessary to find the merge base with
          # the durable draft checkpoint branch. fetch-depth:1 made real
          # related histories appear unrelated after main source merges.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source extractor and Gemini response guards without API key
        run: |
          set -euo pipefail
          node tools/export_verne_chapter.cjs 1 --check
          node tools/export_verne_chapter.cjs 13 --check
          node tools/export_verne_chapter.cjs 37 --check
          python tools/gemini_verne_editorial.py --self-test
      - name: Checkout durable editorial checkpoint branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=content/gemini-verne-editorial-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This output branch carries durable AI drafts, not main code merges.
          # It predates the source-only merge and has add/add duplicate code paths.
          # NEVER merge main into it, which caused fatal conflicts overnight.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" FETCH_HEAD
          else
            git switch -c "$BRANCH"
          fi
          # Restore the EXACT source/text and extractor pinned to the
          # trigger commit into the WORKTREE ONLY. Do not stage these files;
          # commit only generated JSON under docs/literature/staging.
          git restore --source="$GITHUB_SHA" --worktree -- \
            tools/export_verne_chapter.cjs \
            tools/gemini_verne_editorial.py \
            'app/src/main/assets/classic-verne-towle-ch*.js'
          node tools/export_verne_chapter.cjs 37 --check
          python tools/gemini_verne_editorial.py --self-test
      - name: Generate and independently audit bounded bilingual segments
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/gemini_verne_editorial.py --max-segments 8
      - name: Checkpoint completed segments even if later API calls fail
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=content/gemini-verne-editorial-output
          if [ "$(git branch --show-current)" != "$BRANCH" ]; then
            echo "Safe checkpoint branch not checked out; skipping output commit"
            exit 0
          fi
          DIR=docs/literature/staging/gemini-verne-editorial
          if [ -d "$DIR" ]; then
            git add -f "$DIR"
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No new Gemini output to checkpoint"
          else
            git commit -m "Literature: checkpoint source-hashed Gemini chapter draft and QA segments"
          fi
          git push origin "HEAD:$BRANCH"
      - name: Keep inspectable artifacts on successful or partial output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: gemini-verne-editorial-checkpoint
          path: docs/literature/staging/gemini-verne-editorial/
          if-no-files-found: ignore
          retention-days: 21
