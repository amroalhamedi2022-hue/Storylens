<style>
:root{color-scheme:light;--body:#eff5f3;--card:#fff;--ink:#1b3035;--sub:#697f82;--accent:#287875;--reader:#f8f5ee;--reader-ink:#233337;--font:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;color:var(--ink);background:var(--body)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #55a7a2}
.page{min-height:100dvh}.library{max-width:1120px;margin:auto;padding:32px 20px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{letter-spacing:.3em;font-size:13px;font-weight:900;color:var(--accent);direction:ltr;text-align:left}.header h1{font-size:clamp(22px,4.5vw,34px);margin:8px 0}.quiet{color:var(--sub);font-size:14px}.pill{border:1px solid #c8dad7;padding:9px 14px;border-radius:100px;background:transparent;white-space:nowrap;color:inherit}.pill.active{color:white;border-color:var(--accent);background:var(--accent)}.filters{display:flex;overflow:auto;gap:8px;scrollbar-width:none;margin:25px 0 23px;padding-bottom:5px}.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:15px}.card{background:var(--card);border-radius:18px;padding:11px;display:flex;gap:15px;cursor:pointer;min-height:178px;box-shadow:0 5px 30px #1a47420b;transition:transform .15s}.card:hover{transform:translateY(-2px)}.cover{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(150deg,#141a2d,#566f81);border-radius:12px;flex:0 0 111px;min-height:157px}.cover:before{content:"";display:block;position:absolute;width:70px;height:70px;border-radius:50%;top:13%;right:18%;background:#e4bea2a0;box-shadow:0 0 55px #fff3}.cover:after{content:"";position:absolute;left:0;right:0;bottom:0;height:47%;background:repeating-linear-gradient(90deg,#0f202b 0 23px,#182b35 23px 35px);clip-path:polygon(0 23%,20% 0,40% 30%,65% 6%,100% 24%,100% 100%,0 100%)}.cover.art:before,.cover.art:after{display:none}.cover.art{background-size:cover;background-position:center}.cover.night_train{background:linear-gradient(160deg,#070c1b,#385669)}.cover.ice{background:radial-gradient(circle at 55% 58%,#0d2c41 0 17%,#5bd2d5 18%,#145475 33%,#07182e 75%)}.cover.ice:after{background:repeating-linear-gradient(130deg,#d2ffff35 0 2px,transparent 2px 35px);clip-path:none;height:100%}.cover.wall{background:linear-gradient(135deg,#182331,#987863)}.cover.wall:after{height:66%;width:53%;left:22%;right:auto;background:#17212b;border:9px solid #b89a8d;clip-path:none}.cover.map{background:repeating-linear-gradient(18deg,#a78e6a 0 2px,#73664c 2px 31px)}.cover.map:after{background:none;border:4px dashed #d2bc8e;width:83%;height:67%;bottom:9%;left:8%;border-radius:100%;clip-path:none}.cover.city{background:linear-gradient(135deg,#192e46,#a47d7b)}.cover.house{background:linear-gradient(160deg,#181727,#725b60)}
.card-content{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;direction:ltr;text-align:left}.card h2{font-family:Georgia,serif;font-size:21px;margin:0}.card .lvl{font-size:12px;font-weight:800;color:var(--accent)}.card .sub{color:var(--sub);font-size:12px}.card .desc{font-size:12px;line-height:1.6;opacity:.82}.secondary{background:transparent;color:var(--accent);border:1px solid #a7ceca;border-radius:13px;padding:11px 15px}.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 16px}.reader{min-height:100dvh;background:var(--reader);color:var(--reader-ink);direction:ltr;position:relative;padding-bottom:45px}.reader.dark{--reader:#101a1d;--reader-ink:#d8e4e0}.reading-width{max-width:760px;margin:auto;padding:0 25px}.reader-hero{height:180px;max-width:760px;margin:auto;cursor:pointer;border-radius:0 0 20px 20px}.reader-label{color:var(--accent);letter-spacing:.13em;font-size:12px;margin:31px 0 14px}.reader h2{font:normal clamp(31px,7vw,42px) Georgia,serif;line-height:1.22;margin:0 0 26px}.sentence{font:var(--font)/1.75 Georgia,"Times New Roman",serif;margin:0 0 17px;cursor:text}.tok{cursor:pointer;border-radius:2px}.tok:active{background:#53a8a333}.inline-ar{font:17px/1.95 system-ui,sans-serif;direction:rtl;text-align:right;opacity:.79;margin:-6px 0 23px}.chapter-end{text-align:center;margin:43px auto 0;padding:35px 0 0;border-top:1px solid #7774;color:var(--reader-ink)}.chapter-end .primary{margin-top:22px}.toolbar{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;gap:7px;background:var(--reader);box-shadow:0 2px 15px #0001;padding:7px 13px;z-index:9}.toolbar button{border:0;background:transparent;color:var(--accent);padding:8px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#07101583;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;width:min(100%,710px);max-height:88dvh;overflow:auto;padding:25px 24px 37px;box-shadow:0 -4px 30px #0002}.sheet h2{margin:0 0 16px;font:28px Georgia,serif;direction:ltr;text-align:left}.sheet label{display:block;font-weight:700;margin:16px 0 5px}.sheet p{line-height:1.75;margin:4px 0}.sheet .en{direction:ltr;text-align:left;font-family:Georgia,serif;font-size:17px}.sheet footer{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.sheet footer button{flex:1}.sheet .tag{color:var(--accent);font-size:12px;letter-spacing:.1em;font-weight:800}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0}.arabic-page.dark{--reader:#101a1d;--reader-ink:#d8e4e0}.arabic-page{background:var(--reader);color:var(--reader-ink);min-height:100dvh;direction:rtl}.arabic-inner{max-width:760px;margin:auto;padding:30px 25px}.arabic-inner p{font-size:21px;line-height:2;margin:0 0 12px}.arabic-inner h2{font-size:25px;margin:34px 0 19px}.arabic-inner h1{font-family:Georgia,serif;direction:ltr;text-align:left}.vocab{max-width:800px;margin:auto;padding:25px}.vitem{padding:17px;border-radius:14px;margin-bottom:12px;background:var(--card)}.vitem h3{font:24px Georgia;margin:2px 0;direction:ltr;text-align:left}
.library-actions{display:flex;gap:8px;flex-wrap:wrap}.search-label{display:block;margin:20px 0 0}.search-label input{margin-top:7px;width:100%;background:#fff;border:1px solid #c5d9d3;padding:14px 17px;border-radius:14px;font:inherit;color:var(--ink)}.review-card{margin-top:30px;padding:23px;background:white;border-radius:22px;box-shadow:0 8px 30px #0001}.review-card .en-prompt{font:24px/1.65 Georgia,serif;direction:ltr;text-align:left;color:#1d3536}.review-card .rating{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.review-card .rating button{flex:1}.review-card h2{font:28px Georgia,serif}.review{min-height:100dvh}@media(min-width:950px){.reader-hero{height:220px}.reading-width{padding:0 40px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* StoryLens motion: restrained in reading mode; lively but calm in browsing. */
.library{background:radial-gradient(ellipse 70% 36% at 85% 0%,#a9ded423,transparent),radial-gradient(ellipse 50% 30% at 12% 45%,#95b4d01c,transparent)}
.card{border:1px solid #aacbc226;box-shadow:0 10px 36px #163c3712;transition:transform .28s cubic-bezier(.2,.75,.2,1),box-shadow .28s ease}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 52px #163c3723}
.card:active{transform:scale(.985)}
.card .cover{transition:filter .28s ease}
.card:hover .cover{filter:brightness(1.1) saturate(1.06)}
.sheet{animation:sheet-in .24s cubic-bezier(.2,.8,.2,1)}
.overlay{animation:veil-in .18s ease}
@keyframes sheet-in{from{transform:translateY(22px);opacity:.75}to{transform:translateY(0);opacity:1}}
@keyframes veil-in{from{opacity:0}to{opacity:1}}
.reader{background:var(--reader);transition:background .35s ease}
.reader .sentence{letter-spacing:.01em;text-wrap:pretty}
.reader .tok:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reader .tok:active{background:#53a8a322}
#reading-progress{position:fixed;top:0;left:0;height:2px;z-index:30;width:0;background:linear-gradient(90deg,#45ada5,#b6d9b3);opacity:0;transition:width .16s linear,opacity .2s}
@media(prefers-reduced-motion:reduce){.sheet,.overlay{animation:none!important}.card{transition:none!important}#reading-progress{transition:none!important}}

<script id="libraryData" type="application/json">{"version":1,"displayName":"Lingua Tales","targetPerGenre":20,"genres":[{"id":"mystery","en":"Mystery & Crime","ar":"غموض وتحقيق"},{"id":"sci_fi","en":"Science Fiction","ar":"خيال علمي"},{"id":"psychological","en":"Psychological Thriller","ar":"تشويق نفسي"},{"id":"historical","en":"Historical Fiction","ar":"قصص تاريخية"},{"id":"contemporary","en":"Modern Life","ar":"دراما معاصرة"},{"id":"horror","en":"Literary Horror","ar":"رعب أدبي"}],"stories":[{"id":"last-passenger","title":"The Last Passenger","subtitle":"One ticket. No return.","genre":"mystery","level":"B2","cover":"night_train","description":"At a nearly abandoned station, an impossible ticket reveals a dangerous secret.","chapters":[{"title":"A Ticket for Tomorrow","titleAr":"تذكرة للغد","paragraphs":[{"en":"At 11:47 p.m., the last train reached Blackmere Station without making a sound.","ar":"عند الحادية عشرة وسبع وأربعين دقيقة ليلًا، وصل آخر قطار إلى محطة بلاكمير بصمت تام."},{"en":"Mara had worked the night shift for seven years, but she had never seen its lights go out before it stopped.","ar":"كانت مارا تعمل في المناوبة الليلية منذ سبع سنوات، لكنها لم ترَ أضواءه تنطفئ قبل توقفه من قبل."},{"en":"Only one passenger stepped onto the platform: a man carrying a wet leather case.","ar":"نزل إلى الرصيف راكب واحد فقط، رجل يحمل حقيبة جلدية مبتلّة."},{"en":"He asked whether the tunnel beyond the station was still sealed.","ar":"سألها إن كان النفق خلف المحطة ما يزال مغلقًا."},{"en":"She told him it had been closed since the flood, twenty years earlier.","ar":"أخبرته أنه مغلق منذ الفيضان الذي وقع قبل عشرين عامًا."},{"en":"The man went pale and slipped a ticket beneath the glass.","ar":"شحب وجه الرجل ودسّ تذكرة من تحت الزجاج."},{"en":"The departure date was tomorrow, and the passenger name was Mara Vale.","ar":"كان تاريخ المغادرة هو الغد، واسم الراكبة مارا ڤيل."},{"en":"Before she could ask a question, he vanished into the unlit carriage.","ar":"وقبل أن تتمكن من سؤاله، اختفى داخل العربة المعتمة."},{"en":"A voice crackled over the old radio: “Do not let that train leave.”","ar":"انطلق صوت متقطع من جهاز اللاسلكي القديم: «لا تسمحي لذلك القطار بالمغادرة»."},{"en":"Mara looked at the ticket again and noticed a second line printed in tiny letters: Witness Protection.","ar":"نظرت مارا مجددًا إلى التذكرة ولاحظت سطرًا ثانيًا بحروف صغيرة: حماية الشهود."}]},{"title":"The Sealed Tunnel","titleAr":"النفق المغلق","paragraphs":[{"en":"The signal box was empty, although someone had switched every track toward the sealed tunnel.","ar":"كانت غرفة الإشارات خالية، مع أن أحدهم حوّل جميع السكك نحو النفق المغلق."},{"en":"Mara could have walked away, but the station doors had locked behind her.","ar":"كان بوسع مارا أن ترحل، لكن أبواب المحطة أُغلقت خلفها."},{"en":"She followed a trail of water to the train and found the leather case on an empty seat.","ar":"تتبعت أثر الماء حتى القطار، فوجدت الحقيبة الجلدية على مقعد فارغ."},{"en":"Inside lay photographs of the flood and a report marked “Deliberate Sabotage.”","ar":"كان بداخلها صور للفيضان وتقرير كُتب عليه «تخريب متعمد»."},{"en":"Her father had signed that report and disappeared the following week.","ar":"كان والدها قد وقّع التقرير ثم اختفى في الأسبوع التالي."},{"en":"A figure moved behind the frosted window of the control room.","ar":"تحرك ظلّ خلف الزجاج المعتم لغرفة التحكم."},{"en":"Mara pulled the emergency brake just as the train began to creep forward.","ar":"سحبت مارا مكبح الطوارئ لحظة بدأ القطار يتحرك ببطء."},{"en":"The figure ran, leaving a phone on the desk with a message: “Finish what your father started.”","ar":"هرب صاحب الظل تاركًا هاتفًا على المكتب ورسالة تقول: «أكملي ما بدأه والدك»."},{"en":"By dawn, the police had the evidence and the tunnel was closed for good.","ar":"مع الفجر، أصبحت الأدلة في يد الشرطة وأُغلق النفق نهائيًا."},{"en":"Mara kept the impossible ticket; on its back, in her father’s handwriting, were the words “I knew you would look closer.”","ar":"احتفظت مارا بالتذكرة المستحيلة؛ فعلى ظهرها، بخط والدها، كُتبت عبارة «كنت أعرف أنك ستدققين أكثر»."}]}],"terms":[{"term":"night shift","literal":"المناوبة الليلية","context":"دوام العمل ليلًا","type":"collocation","note":"شائع في بيئات العمل."},{"term":"went pale","literal":"أصبح شاحب اللون","context":"اصفرّ وجهه من الخوف","type":"phrase","note":"وصف طبيعي للصدمة."},{"term":"slipped","literal":"انزلق / دسّ","context":"دسّ التذكرة بسرعة","type":"verb","note":"يتحدد المعنى بحسب الفعل."},{"term":"vanished","literal":"اختفى","context":"اختفى من الأنظار","type":"verb","note":"أقوى قليلًا من disappeared."},{"term":"crackled","literal":"أصدر طقطقة","context":"خرج الصوت متقطعًا عبر اللاسلكي","type":"verb","note":"كثيرًا ما تُستخدم مع أجهزة الراديو."},{"term":"walked away","literal":"مشى مبتعدًا","context":"انسحب وترك الأمر","type":"phrasal verb","note":"قد تحمل معنى التخلّي عن مسؤولية."},{"term":"a trail of","literal":"أثر ممتد","context":"سلسلة آثار ماء تشير إلى الطريق","type":"phrase","note":"تُستخدم مع الماء والدم والدخان."},{"term":"for good","literal":"للخير حرفيًا","context":"إلى الأبد / نهائيًا","type":"idiom","note":"لا تعني هنا «من أجل الخير»."},{"term":"look closer","literal":"انظر عن قرب","context":"دقّق أكثر","type":"phrase","note":"مناسبة عند طلب الانتباه إلى التفاصيل."}]},{"id":"ninth-ice","title":"Beneath the Ninth Ice","subtitle":"The ocean heard them first.","genre":"sci_fi","level":"B2","cover":"ice","description":"A research crew on Europa discovers a message that should not exist.","chapters":[{"title":"The Sound Underneath","titleAr":"الصوت القادم من الأعماق","paragraphs":[{"en":"The drilling team had spent eight months beneath the ice of Europa without hearing anything except machinery.","ar":"أمضى فريق الحفر ثمانية أشهر تحت جليد أوروبا، ولم يسمعوا خلالها سوى ضجيج الآلات."},{"en":"Then, one Tuesday, the ocean answered their sonar with three deliberate knocks.","ar":"ثم في أحد أيام الثلاثاء ردّ المحيط على جهاز السونار بثلاث طرقات بدت مقصودة."},{"en":"Dr. Imani Rook replayed the recording until her coffee turned cold.","ar":"أعادت الدكتورة إيماني روك التسجيل مرارًا حتى بردت قهوتها."},{"en":"The pattern was not random; it repeated every ninety-one seconds.","ar":"لم يكن النمط عشوائيًا؛ بل تكرر كل إحدى وتسعين ثانية."},{"en":"Their commander insisted that ice pressure could explain the sound.","ar":"أصرّ قائدهم على أن ضغط الجليد قد يفسّر الصوت."},{"en":"Imani was not convinced, especially when the next signal spelled out the station’s name.","ar":"لم تقتنع إيماني، خصوصًا حين حملت الإشارة التالية اسم المحطة حرفًا حرفًا."},{"en":"The oldest computer in the lab suddenly displayed a file dated forty years in the future.","ar":"فجأة عرض أقدم حاسوب في المختبر ملفًا يحمل تاريخًا بعد أربعين عامًا."},{"en":"Its title read: “A Warning, Not a Greeting.”","ar":"وكان عنوانه: «تحذير، وليس تحية»."},{"en":"At the bottom, beneath pages of numbers, someone had typed a simple instruction: Stop digging.","ar":"وفي آخره، تحت صفحات من الأرقام، كتب شخص تعليمات بسيطة: توقفوا عن الحفر."}]},{"title":"The Choice","titleAr":"القرار","paragraphs":[{"en":"The commander called it a malfunction and ordered the drill to continue.","ar":"وصف القائد الأمر بأنه عطل وأمر بمواصلة الحفر."},{"en":"Imani examined the signal and found an image hidden inside its frequencies.","ar":"حللت إيماني الإشارة فاكتشفت صورة مخبأة داخل تردداتها."},{"en":"It showed the station underwater, with every emergency hatch open.","ar":"أظهرت الصورة المحطة غارقة، وجميع فتحات الطوارئ فيها مفتوحة."},{"en":"She realized that the knocking was not coming from below but from their own equipment, reflected through the ice.","ar":"أدركت أن الطرقات لم تأتِ من الأسفل، بل من معداتهم نفسها بعدما انعكست الإشارة عبر الجليد."},{"en":"Someone had sent a recording backward through the experimental communication array.","ar":"كان أحدهم قد أرسل تسجيلًا إلى الماضي عبر منظومة اتصالات تجريبية."},{"en":"With minutes to spare, she cut the power to the drill.","ar":"وقبل فوات الأوان بدقائق، قطعت الكهرباء عن آلة الحفر."},{"en":"A crack spread across the chamber window, then stopped just short of the frame.","ar":"امتد شرخ في نافذة الحجرة، ثم توقف على مسافة ضئيلة من إطارها."},{"en":"The commander finally understood what they had almost unleashed.","ar":"فهم القائد أخيرًا ما كادوا أن يطلقوا العنان له."},{"en":"Weeks later, Imani sent a single message through the array: “We listened.”","ar":"بعد أسابيع، أرسلت إيماني رسالة واحدة عبر المنظومة: «لقد أصغينا»."},{"en":"Ninety-one seconds later, the ocean knocked once.","ar":"وبعد إحدى وتسعين ثانية، جاءت طرقة واحدة من أعماق المحيط."}]}],"terms":[{"term":"not convinced","literal":"غير مقتنع","context":"لم تصدّق التفسير","type":"phrase","note":"تُستخدم للاعتراض المهذب."},{"term":"spelled out","literal":"هجّى الحروف","context":"يكتب/يحدد اسم المحطة حرفًا حرفًا","type":"phrasal verb","note":"أيضًا تعني أن توضح شيئًا بشكل صريح."},{"term":"malfunction","literal":"خلل وظيفي","context":"عطل في المعدات","type":"noun","note":"كلمة شائعة في السياقات التقنية."},{"term":"with minutes to spare","literal":"وبضع دقائق باقية","context":"في اللحظة الأخيرة تقريبًا","type":"phrase","note":"spare هنا بمعنى وقت زائد قبل الموعد."},{"term":"unleashed","literal":"أطلق / حرر","context":"تسبّب في انطلاق خطر غير مسيطر عليه","type":"verb","note":"تستخدم كثيرًا مع القوى أو الكوارث."},{"term":"array","literal":"ترتيب/مصفوفة","context":"منظومة اتصالات متعددة الأجزاء","type":"noun","note":"معناها يتغير باختلاف المجال."}]},{"id":"wall-between","title":"The Wall Between","subtitle":"Some secrets make noise.","genre":"psychological","level":"C1","cover":"wall","description":"A lawyer investigates a tapping sound that seems tied to her past.","chapters":[{"title":"Three Knocks","titleAr":"ثلاث طرقات","paragraphs":[{"en":"Every night at 2:13, someone knocked three times on the wall of Lena’s apartment.","ar":"كل ليلة عند الثانية وثلاث عشرة دقيقة، كان أحدهم يطرق جدار شقة لينا ثلاث مرات."},{"en":"The landlord swore that the flat next door had been vacant for years.","ar":"أقسم المالك أن الشقة المجاورة خالية منذ سنوات."},{"en":"Lena, a lawyer who trusted documents more than people, asked to see the property records.","ar":"طلبت لينا، وهي محامية تثق بالأوراق أكثر من البشر، الاطلاع على سجلات العقار."},{"en":"The previous tenant’s name was familiar enough to make her stomach drop.","ar":"كان اسم المستأجر السابق مألوفًا لدرجة جعلت قلبها يهوي من الخوف."},{"en":"She had represented the company that evicted him after a factory accident.","ar":"كانت قد مثّلت الشركة التي طردته من مسكنه بعد حادث في مصنع."},{"en":"That case had made her career, yet she had never questioned the witness statements.","ar":"كانت تلك القضية نقطة انطلاق مسيرتها المهنية، لكنها لم تشكك يومًا في شهادات الشهود."},{"en":"The next night, the knocks came in groups of three, two, then one.","ar":"في الليلة التالية جاءت الطرقات على شكل ثلاث، ثم اثنتين، ثم واحدة."},{"en":"She recognized the rhythm from a recording she had dismissed as irrelevant evidence.","ar":"تعرّفت إلى الإيقاع من تسجيل استبعدته يومًا باعتباره دليلًا غير ذي صلة."},{"en":"For the first time in years, Lena opened the old case file.","ar":"ولأول مرة منذ سنوات، فتحت لينا ملف القضية القديم."}]},{"title":"What the Walls Kept","titleAr":"ما أخفته الجدران","paragraphs":[{"en":"The recording contained a safety alarm that had sounded before the accident, not after it.","ar":"احتوى التسجيل على إنذار سلامة دقّ قبل الحادث، لا بعده."},{"en":"The distinction proved that the company had ignored a warning.","ar":"كان هذا الفرق كافيًا لإثبات أن الشركة تجاهلت تحذيرًا واضحًا."},{"en":"When Lena confronted the landlord, he admitted he had installed a speaker in the empty flat.","ar":"وحين واجهت لينا المالك، اعترف بأنه ثبّت مكبرًا للصوت داخل الشقة الخالية."},{"en":"The former tenant was his brother, and he wanted the truth to be heard.","ar":"كان المستأجر السابق شقيقه، وأراد أن تخرج الحقيقة إلى العلن."},{"en":"Lena was furious at the manipulation, but she could not deny the evidence.","ar":"غضبت لينا من التلاعب بها، لكنها لم تستطع إنكار الدليل."},{"en":"She contacted the family and offered to reopen the case without charging a fee.","ar":"تواصلت مع العائلة وعرضت إعادة فتح القضية دون أتعاب."},{"en":"“You cannot undo what happened,” the brother told her, “but you can stop hiding it.”","ar":"قال لها شقيقه: «لا يمكنك محو ما حدث، لكن يمكنك التوقف عن إخفائه»."},{"en":"On the morning she filed the new evidence, the apartment finally fell silent.","ar":"في صباح اليوم الذي قدّمت فيه الأدلة الجديدة، ساد الصمت أخيرًا في الشقة."},{"en":"Lena discovered that silence could be heavier than any sound.","ar":"اكتشفت لينا أن الصمت قد يكون أثقل من أي صوت."}]}],"terms":[{"term":"make her stomach drop","literal":"تجعل معدتها تهبط حرفيًا","context":"شعرت بفزع مفاجئ","type":"idiom","note":"تعبير مجازي عن الخوف أو القلق."},{"term":"evicted","literal":"أُخرج قسرًا","context":"طُرد من سكنه قانونيًا","type":"verb","note":"مهم في السياقات القانونية والسكنية."},{"term":"dismissed","literal":"رفض / صرف","context":"استبعدت الدليل","type":"verb","note":"يختلف المعنى بين dismiss a case و dismiss an employee."},{"term":"irrelevant","literal":"غير ذي صلة","context":"لا علاقة له بالقضية","type":"adjective","note":"عكس relevant."},{"term":"the distinction","literal":"التمييز / الفرق","context":"الاختلاف الحاسم بين توقيتين","type":"noun","note":"شائع في التحليل والحجج."},{"term":"reopen the case","literal":"إعادة فتح القضية","context":"إعادة النظر في ملف قضائي","type":"collocation","note":"صياغة قانونية مألوفة."},{"term":"undo","literal":"يفكّ / يلغي","context":"يمحو أثر ما حصل","type":"verb","note":"Can’t undo the past: لا يمكن تغيير الماضي."}]},{"id":"mapmakers-ink","title":"The Mapmaker’s Ink","subtitle":"In wartime, a line can save a life.","genre":"historical","level":"B2","cover":"map","description":"Lisbon, 1943: a cartographer discovers that some maps are meant to mislead.","chapters":[{"title":"The False Border","titleAr":"الحدود الوهمية","paragraphs":[{"en":"Lisbon, 1943: the city was full of people waiting for papers that might never arrive.","ar":"لشبونة، عام 1943: كانت المدينة تعج بأشخاص ينتظرون أوراقًا ربما لا تصل أبدًا."},{"en":"Elisa made maps for shipping companies and kept her opinions to herself.","ar":"كانت إليسا ترسم خرائط لشركات الشحن وتحتفظ بآرائها لنفسها."},{"en":"One rainy afternoon, a stranger ordered a map of a border that did not exist.","ar":"في عصر ممطر، طلب منها غريب خريطة لحدود غير موجودة."},{"en":"He paid in advance and left a small envelope beneath the ruler.","ar":"دفع مقدمًا وترك ظرفًا صغيرًا تحت المسطرة."},{"en":"It contained twelve names, twelve dates of birth, and a photograph of a crowded harbor.","ar":"احتوى الظرف على اثني عشر اسمًا وتاريخ ميلاد، وصورة لميناء مزدحم."},{"en":"A note asked her to draw a safe route without marking a single road.","ar":"طلبت منها ورقة صغيرة رسم طريق آمن من دون الإشارة إلى أي شارع."},{"en":"At first, the request seemed absurd.","ar":"بدا الطلب عبثيًا في البداية."},{"en":"Then she noticed that the names matched boats scheduled to depart at dawn.","ar":"ثم لاحظت أن الأسماء تطابق أسماء قوارب مقررة للمغادرة عند الفجر."},{"en":"Someone was using the map as a coded passenger list.","ar":"كان أحدهم يستخدم الخريطة قائمةً مشفّرة للركاب."}]},{"title":"Lines of Escape","titleAr":"خطوط النجاة","paragraphs":[{"en":"Elisa drew the coastline in ordinary blue ink and hid the names inside its tiny curves.","ar":"رسمت إليسا الساحل بحبر أزرق عادي، وأخفت الأسماء داخل انحناءاته الدقيقة."},{"en":"A customs officer arrived before she could finish.","ar":"وصل موظف الجمارك قبل أن تنتهي."},{"en":"He studied the map for a long time and asked why one island had moved.","ar":"تمعّن في الخريطة طويلًا وسأل لماذا تغيّر موقع إحدى الجزر."},{"en":"Elisa answered that maps were never as precise as people believed.","ar":"أجابته إليسا بأن الخرائط ليست دقيقة كما يعتقد الناس."},{"en":"The officer smiled; he had recognized the signal.","ar":"ابتسم الموظف؛ فقد تعرّف إلى الإشارة."},{"en":"He quietly crossed out one name and wrote another in its place.","ar":"شطب بهدوء اسمًا وكتب آخر مكانه."},{"en":"“The first passenger was arrested yesterday,” he whispered.","ar":"همس: «اعتُقل الراكب الأول أمس»."},{"en":"At sunrise, eleven people boarded a fishing boat using Elisa’s altered map.","ar":"عند الشروق، صعد أحد عشر شخصًا إلى قارب صيد مستعينين بخريطة إليسا المعدلة."},{"en":"She burned the original, knowing that sometimes a map told the truth only by leaving things out.","ar":"أحرقت النسخة الأصلية، وقد أدركت أن الخريطة قد تقول الحقيقة أحيانًا بما تتعمد إخفاءه."}]}],"terms":[{"term":"kept her opinions to herself","literal":"أبقت آراءها لنفسها","context":"تجنبت التصريح بمواقفها","type":"idiom","note":"للحفاظ على الخصوصية أو تفادي المشاكل."},{"term":"paid in advance","literal":"دفع مسبقًا","context":"سدّد المبلغ قبل إنجاز العمل","type":"phrase","note":"شائع في الشراء والحجوزات."},{"term":"at dawn","literal":"عند الفجر","context":"في وقت الفجر","type":"phrase","note":"dawn أدبي قليلًا مقارنة بـ early morning."},{"term":"coded","literal":"مرمّز / مشفّر","context":"مكتوب بطريقة تخفي المعنى","type":"adjective","note":"قد يعني شفرة سرية أو ترميزًا تقنيًا."},{"term":"crossed out","literal":"رسم خطًا فوق","context":"شطب اسمًا من القائمة","type":"phrasal verb","note":"يستخدم في تعديل النصوص."},{"term":"leaving things out","literal":"ترك الأشياء خارجًا","context":"حذف بعض المعلومات عمدًا","type":"phrase","note":"leave out = يتجاهل أو يحذف."}]},{"id":"second-interview","title":"The Second Interview","subtitle":"Truth never arrives on schedule.","genre":"contemporary","level":"B2","cover":"city","description":"A former reporter finds a second chance in a town that remembers everything.","chapters":[{"title":"A Familiar Question","titleAr":"سؤال مألوف","paragraphs":[{"en":"When Nadia returned to her hometown, the newspaper office had become a furniture shop.","ar":"حين عادت ناديا إلى بلدتها، كان مكتب الصحيفة القديمة قد تحوّل إلى متجر أثاث."},{"en":"She had left ten years earlier after publishing a story that cost a friend his job.","ar":"كانت قد غادرت قبل عشر سنوات بعدما نشرت تحقيقًا تسبب بفقدان صديقها لعمله."},{"en":"Now the town wanted her to interview the mayor about a new riverfront development.","ar":"والآن طلبت منها البلدة إجراء مقابلة مع العمدة حول مشروع جديد لتطوير ضفاف النهر."},{"en":"The offer sounded straightforward, which made Nadia suspicious.","ar":"بدا العرض بسيطًا وواضحًا، وهذا تحديدًا ما أثار شك ناديا."},{"en":"At the meeting, the mayor praised transparency but refused to discuss the old chemical plant.","ar":"في اللقاء، امتدح العمدة الشفافية لكنه رفض مناقشة مصنع المواد الكيميائية القديم."},{"en":"A cleaner waiting outside slipped Nadia a folder full of water-testing reports.","ar":"دسّ عامل نظافة ينتظر في الخارج ملفًا في يد ناديا يحوي تقارير لفحص المياه."},{"en":"The latest results were missing, and the earlier numbers did not add up.","ar":"كانت أحدث النتائج مفقودة، أما الأرقام السابقة فلم تكن منطقية."},{"en":"Nadia recognized the cleaner: it was the friend she had once betrayed.","ar":"تعرّفت ناديا إلى عامل النظافة؛ لقد كان الصديق الذي خذلته قبل سنوات."},{"en":"He said, “This time, ask the question they do not want you to ask.”","ar":"قال لها: «هذه المرة اسألي السؤال الذي لا يريدون سماعه»."}]},{"title":"On the Record","titleAr":"رسميًا وعلى الملأ","paragraphs":[{"en":"Nadia requested the missing reports through a public records procedure.","ar":"طلبت ناديا التقارير الناقصة وفق إجراءات الحصول على السجلات العامة."},{"en":"The town council tried to delay the request, but an independent laboratory had kept copies.","ar":"حاول المجلس البلدي تأخير الطلب، لكن مختبرًا مستقلًا كان قد احتفظ بنسخ."},{"en":"The documents showed contamination near the planned construction site.","ar":"أظهرت الوثائق وجود تلوّث قرب موقع البناء المزمع."},{"en":"At the second interview, Nadia placed the reports on the table and asked the mayor to explain them on the record.","ar":"في المقابلة الثانية، وضعت ناديا التقارير على الطاولة وطلبت من العمدة تفسيرها رسميًا."},{"en":"He looked away and said the numbers were being reviewed.","ar":"أشاح بنظره وقال إن الأرقام قيد المراجعة."},{"en":"For once, Nadia did not rush to publish a dramatic headline.","ar":"هذه المرة لم تتسرع ناديا في نشر عنوان مثير."},{"en":"She verified every claim and gave the people affected a chance to speak.","ar":"تحققت من كل ادعاء ومنحت المتضررين فرصة للكلام."},{"en":"The article forced the council to suspend the project pending an investigation.","ar":"أجبر المقال المجلس على تعليق المشروع إلى حين إجراء تحقيق."},{"en":"Her friend read it twice, then nodded without smiling.","ar":"قرأ صديقها المقال مرتين ثم أومأ من دون ابتسامة."},{"en":"Trust, Nadia understood, was not something a single good story could restore.","ar":"أدركت ناديا أن الثقة لا يعيدها تحقيق صحفي جيد واحد."}]}],"terms":[{"term":"straightforward","literal":"مباشر / واضح","context":"يبدو بلا تعقيدات","type":"adjective","note":"في سياقات العمل شائع جدًا."},{"term":"did not add up","literal":"لم يُجمع حسابيًا حرفيًا","context":"كانت الأرقام متناقضة أو غير منطقية","type":"idiom","note":"something doesn’t add up = هناك شيء غير مريح أو مشبوه."},{"term":"on the record","literal":"على السجل حرفيًا","context":"بشكل رسمي وقابل للنشر أو الاقتباس","type":"phrase","note":"مصطلح صحفي مهم."},{"term":"looked away","literal":"نظر بعيدًا","context":"أشاح بوجهه وتجنب النظر","type":"phrasal verb","note":"قد يدل على الحرج أو التهرب."},{"term":"pending","literal":"بانتظار","context":"إلى حين استكمال إجراء","type":"preposition","note":"شائعة في القانون والإدارة."},{"term":"a chance to speak","literal":"فرصة للكلام","context":"إتاحة فرصة للمتضررين للتعبير عن رأيهم","type":"collocation","note":"تستخدم في العلاقات والمؤسسات."}]},{"id":"house-mirrors","title":"The House Without Mirrors","subtitle":"Every room remembers.","genre":"horror","level":"C1","cover":"house","description":"An architect inherits a house with one unsettling rule: never uncover the mirrors.","chapters":[{"title":"A Rule in Dust","titleAr":"وصية تحت الغبار","paragraphs":[{"en":"The house had belonged to the same family for a century, yet no one remembered who had built it.","ar":"ظل البيت ملكًا للعائلة قرنًا كاملًا، لكن أحدًا لم يعد يذكر من بناه."},{"en":"When architect Daniel inherited it, he found every mirror covered with black cloth.","ar":"حين ورث المهندس المعماري دانيال البيت، وجد جميع المرايا مغطاة بقماش أسود."},{"en":"A handwritten note on the staircase warned him never to uncover them after sunset.","ar":"حذرته ورقة مكتوبة بخط اليد عند الدرج من كشفها بعد غروب الشمس."},{"en":"Daniel considered himself a rational man, so he removed the cloth from the hall mirror immediately.","ar":"كان دانيال يرى نفسه رجلًا عقلانيًا، لذلك نزع الغطاء عن مرآة المدخل فورًا."},{"en":"Its reflection showed a hallway longer than the one behind him.","ar":"أظهر انعكاسها ممرًا أطول من الممر الحقيقي خلفه."},{"en":"At the far end stood a boy holding an architect’s ruler.","ar":"وفي نهايته البعيدة وقف صبي يحمل مسطرة مهندس."},{"en":"Daniel blinked, and the boy disappeared.","ar":"رمش دانيال بعينيه فاختفى الصبي."},{"en":"That night, the floorboards creaked in rooms that had no floors left.","ar":"في تلك الليلة صرّت ألواح الأرضيات داخل غرف لم تعد فيها أرضيات أصلًا."},{"en":"He found another note beneath a locked door: “The house remembers what you refuse to.”","ar":"وجد رسالة أخرى تحت باب مغلق: «هذا البيت يتذكر ما ترفض أنت تذكّره»."}]},{"title":"The Final Reflection","titleAr":"الانعكاس الأخير","paragraphs":[{"en":"Daniel had redesigned a hospital years earlier, removing a fire exit to make space for a private office.","ar":"قبل سنوات أعاد دانيال تصميم مستشفى، وحذف مخرج طوارئ ليوسّع مكتبًا خاصًا."},{"en":"A fire had followed, and he had persuaded himself that the decision was someone else’s.","ar":"ثم اندلع حريق، وأقنع نفسه أن المسؤولية كانت تقع على شخص آخر."},{"en":"In the mirror, the boy was now standing beside a door marked EXIT.","ar":"في المرآة، كان الصبي يقف الآن قرب باب كُتبت عليه كلمة «مخرج»."},{"en":"The boy did not speak; he simply waited for Daniel to acknowledge him.","ar":"لم ينطق الصبي؛ بل انتظر دانيال أن يعترف بوجوده."},{"en":"Daniel took out his phone and called the investigator who had closed the case.","ar":"أخرج دانيال هاتفه واتصل بالمحقق الذي أغلق القضية."},{"en":"He described the missing exit and offered every drawing he still possessed.","ar":"وصف مخرج الطوارئ المحذوف، وعرض تسليم جميع المخططات التي ما زالت لديه."},{"en":"When he looked up, the mirror showed the ordinary hallway at last.","ar":"حين رفع رأسه، أظهرت المرآة الممر العادي أخيرًا."},{"en":"The house was quiet, but he knew that quiet did not mean forgiveness.","ar":"كان البيت ساكنًا، لكنه أدرك أن السكون لا يعني المغفرة."},{"en":"In the morning, he covered the mirror again—not out of fear, but out of respect for what it had revealed.","ar":"في الصباح أعاد تغطية المرآة، لا خوفًا، بل احترامًا لما كشفته له."}]}],"terms":[{"term":"belonged to","literal":"انتمى إلى / ملك","context":"كان ملكًا للعائلة","type":"phrasal verb","note":"belong to = يكون ملكًا أو جزءًا من."},{"term":"considered himself","literal":"اعتبر نفسه","context":"كان يرى نفسه","type":"phrase","note":"للتعبير عن صورة المرء عن نفسه."},{"term":"at the far end","literal":"في النهاية البعيدة","context":"في أقصى الطرف الآخر","type":"phrase","note":"يُستخدم لوصف المواقع والمسافات."},{"term":"floorboards creaked","literal":"صرّت ألواح الأرضيات","context":"أصدرت الأرضية الخشبية صريرًا","type":"collocation","note":"شائع في الأدب التشويقي."},{"term":"persuaded himself","literal":"أقنع نفسه","context":"أوهم نفسه بصحة تفسير مريح له","type":"phrase","note":"قد يحمل دلالة الإنكار."},{"term":"acknowledge","literal":"يعترف / يُقرّ","context":"يعترف بوجود الشخص أو بالحقيقة","type":"verb","note":"أقوى من notice."},{"term":"out of fear","literal":"بسبب الخوف","context":"بدافع الخوف","type":"phrase","note":"out of + emotion = بدافع كذا."}]},{"id":"third-witness","title":"The Third Witness","subtitle":"The truth has an extra name.","genre":"mystery","level":"C1","cover":"night_train","description":"When a witness vanishes twice, a prosecutor finds an unseen hand in her own case files.","chapters":[{"title":"The Empty Chair","titleAr":"الكرسي الفارغ","paragraphs":[{"en":"The witness room smelled of burnt coffee and furniture polish, as if someone had tried to clean away a bad night.","ar":"كانت غرفة الشهود تفوح برائحة القهوة المحروقة وملمّع الأثاث، كأن أحدهم حاول محو ليلة سيئة بالتنظيف."},{"en":"Prosecutor Eva Mercer checked the clock for the fourth time; her key witness was nineteen minutes late.","ar":"تفقدت المدعية إيفا ميرسر الساعة للمرة الرابعة؛ فقد تأخر شاهدها الرئيسي تسع عشرة دقيقة."},{"en":"He was supposed to identify the man who had ordered the harbor fire.","ar":"كان يفترض أن يحدد هوية الرجل الذي أمر بإشعال حريق الميناء."},{"en":"Instead, an envelope arrived, addressed to Eva in handwriting that resembled her own.","ar":"لكن ظرفًا وصل بدلًا منه، كُتب اسم إيفا عليه بخط يشبه خطها."},{"en":"Inside was a photograph of the witness standing beside her father, who had been dead for twelve years.","ar":"في داخله صورة للشاهد إلى جوار والدها، المتوفى منذ اثني عشر عامًا."},{"en":"The picture had been taken yesterday, according to the time stamp.","ar":"ووفقًا للختم الزمني، التُقطت الصورة أمس."},{"en":"Eva kept her distance from sensational theories; photographs could be altered, and grief could alter judgment.","ar":"كانت إيفا تتجنب التفسيرات المثيرة؛ فالصور يمكن التلاعب بها، والحزن أيضًا قد يفسد الحكم."},{"en":"But she could not explain the scar above her father’s eye, a detail absent from every public record.","ar":"لكنها لم تستطع تفسير الندبة فوق عين والدها، وهي تفصيلة لم تظهر في أي سجل عام."},{"en":"On the reverse, someone had written: “You are looking for the wrong witness.”","ar":"وعلى ظهر الصورة كُتبت جملة: «أنتِ تبحثين عن الشاهد الخطأ»."}]},{"title":"A Loose End","titleAr":"طرف خيط لم يُحسم","paragraphs":[{"en":"Eva traced the photograph to a security camera in a closed municipal archive.","ar":"تتبعت إيفا مصدر الصورة حتى كاميرا مراقبة في أرشيف بلدي مغلق."},{"en":"The building had no electricity, yet its camera had uploaded footage every evening.","ar":"لم يكن في المبنى كهرباء، ومع ذلك كانت كاميرته ترفع تسجيلات كل مساء."},{"en":"A technician found that someone had routed the images through a server in the courthouse.","ar":"اكتشف فني أن أحدهم مرّر الصور عبر خادم في المحكمة."},{"en":"The server belonged to the department that had certified her father’s death.","ar":"وكان الخادم تابعًا للدائرة التي صدّقت شهادة وفاة والدها."},{"en":"She had treated his final investigation as a loose end, painful but unrelated to her career.","ar":"كانت قد اعتبرت تحقيقه الأخير طرف خيط مؤلمًا لكنه لا علاقة له بعملها."},{"en":"Now the harbor fire appeared in his private notebooks, dated years before the current case.","ar":"أما الآن فقد ظهر حريق الميناء في ملاحظاته الشخصية، بتواريخ تسبق القضية الحالية بسنوات."},{"en":"Someone had covered up a chain of deliberate accidents by renaming them insurance disputes.","ar":"كان أحدهم قد تستّر على سلسلة حوادث متعمدة بتصنيفها خلافات تأمين."},{"en":"The missing witness had not fled; he had checked into a shelter under Eva’s childhood surname.","ar":"ولم يكن الشاهد المفقود قد هرب؛ بل سجّل دخوله إلى مأوى مستخدمًا اسم عائلة إيفا قبل زواج والدتها."},{"en":"When she found him, he asked quietly, “Did you ever read the last page?”","ar":"وحين عثرت عليه سألها بهدوء: «هل قرأتِ الصفحة الأخيرة يومًا؟»."}]},{"title":"In Plain Sight","titleAr":"على مرأى من الجميع","paragraphs":[{"en":"The last page held a list of payments, each signed by a different public official.","ar":"حملت الصفحة الأخيرة قائمة مدفوعات وقّع كلًّا منها مسؤول عام مختلف."},{"en":"One signature belonged to the judge assigned to Eva’s case.","ar":"وكان أحد التواقيع لقاضي القضية المسندة إلى إيفا."},{"en":"Her father had hidden the original ledger in plain sight, inside a book of local harbor regulations.","ar":"كان والدها قد أخفى دفتر الحسابات الأصلي على مرأى من الجميع، داخل كتاب لقوانين الميناء المحلية."},{"en":"He had not survived the accident; the photograph was a reconstruction, made to attract her attention.","ar":"لم ينجُ والدها من الحادث؛ كانت الصورة تركيبًا صُمم ليجذب انتباهها."},{"en":"Eva felt anger before relief; someone had used her loss as a tool.","ar":"شعرت إيفا بالغضب قبل الارتياح؛ فقد استغل أحدهم فقدها أداةً للوصول إليها."},{"en":"The witness admitted it and did not ask to be forgiven.","ar":"اعترف الشاهد بذلك ولم يطلب منها أن تسامحه."},{"en":"At the hearing, the judge tried to stop proceedings, but Eva presented the ledger to an independent panel.","ar":"في الجلسة حاول القاضي وقف الإجراءات، إلا أن إيفا عرضت الدفتر على لجنة مستقلة."},{"en":"He backed down only after the names were read aloud.","ar":"ولم يتراجع إلا بعد تلاوة الأسماء بصوت مرتفع."},{"en":"Outside the courthouse, Eva finally understood her father’s final warning: the most dangerous evidence is the evidence everyone agrees not to see.","ar":"وخارج المحكمة أدركت أخيرًا معنى تحذير والدها الأخير: أخطر الأدلة هي تلك التي يتفق الجميع على ألا يروها."}]}],"terms":[{"term":"kept her distance","literal":"حافظت على مسافة","context":"تجنّبت الانجرار إلى تفسيرات غير مثبتة","type":"idiom","note":"قد تكون المسافة عاطفية أو مادية."},{"term":"a loose end","literal":"طرف سائب","context":"مسألة عالقة لم تُحسم","type":"idiom","note":"شائع في التحقيق والأعمال."},{"term":"covered up","literal":"غطّى","context":"تستّر على وقائع عمدًا","type":"phrasal verb","note":"cover up wrongdoing = إخفاء مخالفة."},{"term":"in plain sight","literal":"على مرأى واضح","context":"في مكان ظاهر رغم أن أحدًا لم يلحظه","type":"idiom","note":"يُستخدم كثيرًا في الغموض."},{"term":"backed down","literal":"تراجع للخلف","context":"تراجع عن موقفه تحت الضغط","type":"phrasal verb","note":"ليس بالضرورة انسحابًا جسديًا."}]},{"id":"city-without-night","title":"The City Without Night","subtitle":"Sleep was never optional.","genre":"sci_fi","level":"B2","cover":"ice","description":"A city that never sleeps begins losing its memories one ordinary morning.","chapters":[{"title":"The Bright Hour","titleAr":"الساعة المضيئة","paragraphs":[{"en":"In the city of Solace, darkness was a historical curiosity displayed behind museum glass.","ar":"في مدينة سولاس، كان الظلام مجرد غرابة تاريخية تُعرض خلف زجاج المتاحف."},{"en":"A ring of artificial suns kept every street bright, and the mayor called it the end of fear.","ar":"كانت حلقة من شموس صناعية تُبقي الشوارع مضيئة، وكان العمدة يسمي ذلك نهاية الخوف."},{"en":"Engineer Mina repaired the light network, a job that left her running out of sleep and patience.","ar":"كانت المهندسة مينا تصلح شبكة الإضاءة، وهو عمل يستنزف نومها وصبرها."},{"en":"One morning, her colleague greeted her as if they had never met.","ar":"في أحد الصباحات حيّاها زميلها وكأنهما يلتقيان للمرة الأولى."},{"en":"He remembered the company and his own name but not their ten years of friendship.","ar":"تذكر الشركة واسمه، لكنه لم يتذكر صداقتهما التي امتدت عشر سنوات."},{"en":"By noon, hundreds of residents reported similar gaps in memory.","ar":"وبحلول الظهيرة أبلغ مئات السكان عن فجوات مشابهة في الذاكرة."},{"en":"The government blamed stress, then cut off public access to health records.","ar":"حمّلت الحكومة الضغط النفسي المسؤولية، ثم قطعت وصول الجمهور إلى السجلات الصحية."},{"en":"Mina found an unusual pattern: people forgot memories formed during the brightest hours.","ar":"لاحظت مينا نمطًا غريبًا: كان الناس ينسون الذكريات التي تكوّنت خلال الساعات الأشد إضاءة."},{"en":"She switched off a lamp in her apartment and discovered how loud silence could feel.","ar":"أطفأت مصباحًا في شقتها، واكتشفت كم يمكن للصمت أن يبدو صاخبًا."}]},{"title":"The Hidden Cycle","titleAr":"الدورة المخفية","paragraphs":[{"en":"The control room displayed a steady output, but the underground sensors told a different story.","ar":"أظهرت غرفة التحكم إنتاجًا ثابتًا، لكن المجسات تحت الأرض روت قصة مختلفة."},{"en":"Every six hours, the artificial suns sent a pulse through the streets.","ar":"كل ست ساعات كانت الشموس الصناعية تبث نبضة عبر الشوارع."},{"en":"The pulse reduced panic at the expense of the brain’s ability to store new memories.","ar":"كانت النبضة تخفف الهلع على حساب قدرة الدماغ على تخزين ذكريات جديدة."},{"en":"Officials had approved the system during an epidemic, then quietly renewed it for decades.","ar":"كان المسؤولون قد وافقوا على النظام خلال وباء، ثم جدّدوه سرًا لعقود."},{"en":"Mina presented the logs at an emergency council meeting, where nobody seemed surprised.","ar":"عرضت مينا السجلات في جلسة طارئة للمجلس، ولم يبدُ أحد متفاجئًا."},{"en":"A councilor said that perfect safety required small sacrifices.","ar":"قال أحد أعضاء المجلس إن الأمان الكامل يتطلب تضحيات صغيرة."},{"en":"Mina asked him to name the first sacrifice he remembered making.","ar":"طلبت منه مينا تسمية أول تضحية يتذكر أنه قدّمها."},{"en":"The man stared at the table; he could not remember his daughter’s birthday.","ar":"حدّق الرجل في الطاولة؛ لم يستطع تذكر عيد ميلاد ابنته."},{"en":"That silence was the last straw for the people watching the meeting.","ar":"كان ذلك الصمت القشة التي قصمت ظهر البعير لدى الناس الذين تابعوا الجلسة."}]},{"title":"A Reason to Dream","titleAr":"سبب للحلم","paragraphs":[{"en":"The council offered to reduce the pulse gradually, but Mina insisted on an independent test.","ar":"عرض المجلس تخفيف النبضة تدريجيًا، لكن مينا أصرت على اختبار مستقل."},{"en":"She called it ground truth: evidence gathered beyond the machines that produced the official numbers.","ar":"سمّته الحقيقة الميدانية: أدلة تُجمع خارج الأجهزة التي تنتج الأرقام الرسمية."},{"en":"With a volunteer team, she disconnected one district for a single night.","ar":"وبمساعدة فريق متطوعين، فصلت حيًا واحدًا عن الشبكة ليلة كاملة."},{"en":"People gathered in dark streets, frightened at first by the unfamiliar sky.","ar":"تجمّع الناس في شوارع مظلمة، خائفين في البداية من السماء التي لم يألفوها."},{"en":"Then a child noticed a star, and an old woman began to cry.","ar":"ثم انتبه طفل إلى نجمة، وبدأت امرأة مسنة بالبكاء."},{"en":"The following morning, everyone remembered the night clearly.","ar":"في صباح اليوم التالي تذكر الجميع الليلة بوضوح."},{"en":"The evidence forced the city to replace its permanent daylight with a natural cycle.","ar":"أجبرت الأدلة المدينة على استبدال نهارها الدائم بدورة طبيعية."},{"en":"There were difficult nights, and fear did not vanish with the flick of a switch.","ar":"مرت ليالٍ صعبة، ولم يتبخر الخوف بضغطة زر."},{"en":"But Mina slept beneath the stars and woke remembering the name of every person she loved.","ar":"لكن مينا نامت تحت النجوم واستيقظت وهي تتذكر أسماء كل من تحب."}]}],"terms":[{"term":"running out of","literal":"ينفد منه","context":"يتناقص لديها النوم والصبر","type":"phrasal verb","note":"run out of = ينفد الشيء."},{"term":"cut off","literal":"قطع / فصل","context":"منعت الحكومة الوصول إلى البيانات","type":"phrasal verb","note":"يختلف عن cut off someone = يقاطع شخصًا."},{"term":"at the expense of","literal":"على نفقة","context":"على حساب مصلحة أخرى","type":"phrase","note":"يُبرز كلفة قرار ما."},{"term":"the last straw","literal":"القشة الأخيرة","context":"الأمر الأخير الذي أنهى الصبر","type":"idiom","note":"يُقال بعد سلسلة من المشكلات."},{"term":"ground truth","literal":"الحقيقة الأرضية","context":"بيانات واقعية للتحقق من النماذج","type":"technical term","note":"مصطلح في البحث والذكاء الاصطناعي."}]},{"id":"borrowed-memory","title":"Borrowed Memory","subtitle":"Some apologies are not yours.","genre":"psychological","level":"C1","cover":"wall","description":"A therapist receives a memory of a crime she has never witnessed—and recognizes herself in it.","chapters":[{"title":"A Familiar Stranger","titleAr":"غريب مألوف","paragraphs":[{"en":"The first memory arrived as a smell: orange peel and rain on hot pavement.","ar":"وصلت الذكرى الأولى كرائحة: قشر برتقال ومطر على رصيف ساخن."},{"en":"Therapist Noor was writing notes when she suddenly recalled drowning a red notebook in a river.","ar":"كانت المعالجة النفسية نور تكتب ملاحظاتها حين تذكرت فجأة أنها أغرقت دفترًا أحمر في نهر."},{"en":"She had never visited that river, yet the memory carried the weight of regret.","ar":"لم تكن قد زارت ذلك النهر قط، ومع ذلك حملت الذكرى ثقل الندم."},{"en":"Her new patient, Elias, described the same scene word for word the next afternoon.","ar":"في عصر اليوم التالي وصف مريضها الجديد إلياس المشهد نفسه حرفيًا."},{"en":"Noor began to second-guess her own recollections, something she often warned her patients against.","ar":"بدأت نور تشكك في ذكرياتها الخاصة، وهو ما كانت تحذّر مرضاها منه مرارًا."},{"en":"Elias claimed he had purchased the memory from an unlicensed clinic to feel less alone.","ar":"زعم إلياس أنه اشترى الذكرى من عيادة بلا ترخيص كي يشعر بوحدة أقل."},{"en":"He gave her the clinic’s address, then asked whether guilt could be contagious.","ar":"أعطاها عنوان العيادة، ثم سألها إن كان الشعور بالذنب يمكن أن يكون معديًا."},{"en":"Noor said feelings were not diseases, but she could not put her unease into words.","ar":"قالت نور إن المشاعر ليست أمراضًا، لكنها عجزت عن التعبير عن قلقها بالكلمات."},{"en":"That evening she found orange peel inside her locked desk.","ar":"وفي تلك الليلة وجدت قشر برتقال داخل درج مكتبها المقفل."}]},{"title":"The Price of Relief","titleAr":"ثمن الراحة","paragraphs":[{"en":"The clinic offered wealthy clients the chance to transfer painful recollections to paid volunteers.","ar":"عرضت العيادة على زبائنها الأثرياء نقل الذكريات المؤلمة إلى متطوعين مقابل المال."},{"en":"Its director called the service emotional recycling and expected Noor to take the phrase at face value.","ar":"سمّى المدير الخدمة إعادة تدوير عاطفية، وتوقع من نور أن تقبل التعبير كما هو دون تمحيص."},{"en":"Instead, she asked what happened to the people who received the memories.","ar":"لكنها سألت عمّا يحدث للأشخاص الذين يتلقون تلك الذكريات."},{"en":"He explained that most volunteers eventually came to terms with memories that were not theirs.","ar":"شرح أن معظم المتطوعين يتوصلون في النهاية إلى التعايش مع ذكريات ليست لهم."},{"en":"The few who could not were referred to therapists who knew nothing about the procedure.","ar":"أما القلة الذين يعجزون عن ذلك فيُحالون إلى معالجين لا يعرفون شيئًا عن العملية."},{"en":"Noor recognized names on the referral list, including three former patients.","ar":"تعرفت نور إلى أسماء في قائمة الإحالات، بينها أسماء ثلاثة مرضى سابقين."},{"en":"Their suffering had taken its toll while the original owners went on living comfortably.","ar":"كان عذابهم قد أنهكهم، بينما تابع أصحاب الذكريات الأصليون حياتهم براحة."},{"en":"The river memory belonged to a woman who had hidden evidence of a fatal traffic accident.","ar":"كانت ذكرى النهر تخص امرأة أخفت دليلًا على حادث سير مميت."},{"en":"The clinic had sold that guilt to seven strangers, including Elias and Noor.","ar":"وكانت العيادة قد باعت ذلك الذنب إلى سبعة غرباء، بينهم إلياس ونور."}]},{"title":"What Belongs to Us","titleAr":"ما يخصّنا","paragraphs":[{"en":"Noor refused the clinic’s offer to erase her memory for free.","ar":"رفضت نور عرض العيادة بمحو ذاكرتها مجانًا."},{"en":"Erasing the evidence, she argued, would leave the injustice untouched.","ar":"قالت إن محو الدليل سيترك الظلم قائمًا."},{"en":"She contacted the volunteers and obtained their consent to document the transfers.","ar":"تواصلت مع المتطوعين وحصلت على موافقتهم لتوثيق عمليات النقل."},{"en":"At first, some resented her interference; forgetting had seemed like the only way forward.","ar":"في البداية استاء بعضهم من تدخلها؛ فقد بدا النسيان لهم السبيل الوحيد للمضي قدمًا."},{"en":"Noor listened without promising that exposure would heal them.","ar":"استمعت نور إليهم من دون أن تعدهم بأن كشف الحقيقة سيشفيهم."},{"en":"They filed a joint complaint and released records of the clinic’s concealed injuries.","ar":"قدموا شكوى مشتركة ونشروا سجلات الأضرار التي أخفتها العيادة."},{"en":"The law was slow, and the case did not deliver instant justice.","ar":"كانت الإجراءات القانونية بطيئة، ولم تحقق القضية عدالة فورية."},{"en":"But Elias returned to therapy with a sentence he had written for himself: “The feeling is real; the memory is not mine.”","ar":"لكن إلياس عاد إلى العلاج حاملًا جملة كتبها لنفسه: «الشعور حقيقي، لكن الذكرى ليست لي». "},{"en":"For Noor, that distinction became the beginning of recovery rather than the end of the story.","ar":"وبالنسبة إلى نور، صار ذلك الفرق بداية التعافي لا نهاية الحكاية."}]}],"terms":[{"term":"second-guess","literal":"يخمن ثانية","context":"يشكك في حكمه أو قراره السابق","type":"verb","note":"يتعلق بالتردد وإعادة التقييم."},{"term":"put her unease into words","literal":"تضع قلقها في كلمات","context":"تعبّر بدقة عمّا يزعجها","type":"idiom","note":"put into words = يصوغ بالكلمات."},{"term":"at face value","literal":"بقيمة الوجه","context":"دون تشكيك أو بحث وراء الظاهر","type":"idiom","note":"take something at face value."},{"term":"came to terms with","literal":"وصل إلى شروط","context":"تقبّل حقيقة صعبة وتعايش معها","type":"idiom","note":"تستخدم مع الفقد والتغيير."},{"term":"taken its toll","literal":"أخذ الرسوم","context":"ترك أثرًا مؤذيًا متراكمًا","type":"idiom","note":"التعبير شائع عن الإجهاد والخسارة."}]},{"id":"unsent-letter","title":"The Unsent Letter","subtitle":"Wars end. Paper remembers.","genre":"historical","level":"B2","cover":"map","description":"In divided Berlin, a postal clerk discovers letters that could reunite families—or expose them.","chapters":[{"title":"The Locked Drawer","titleAr":"الدرج المقفل","paragraphs":[{"en":"Berlin, 1962: postal clerk Ruth sorted letters that could not cross the new wall.","ar":"برلين، 1962: كانت موظفة البريد روث تفرز رسائل لم يعد بإمكانها عبور الجدار الجديد."},{"en":"Every envelope bore a name, and every name suggested a life interrupted.","ar":"كان كل ظرف يحمل اسمًا، وكل اسم يشير إلى حياة انقطعت فجأة."},{"en":"Her supervisor asked her to destroy undeliverable mail, but Ruth kept a small stack under the table.","ar":"طلب منها مشرفها إتلاف الرسائل التي تعذّر تسليمها، لكن روث أبقت رزمة صغيرة تحت الطاولة."},{"en":"One letter contained only a recipe and a sentence written in blue ink: “The apricots are early this year.”","ar":"لم تحتوِ إحدى الرسائل إلا على وصفة طعام وجملة بالحبر الأزرق: «المشمش نضج مبكرًا هذا العام». "},{"en":"Ruth recognized the sentence from a coded message her mother had once used during the war.","ar":"تعرّفت روث إلى الجملة من رسالة مشفّرة استخدمتها أمها خلال الحرب."},{"en":"She followed the return address to a building scheduled for demolition.","ar":"اتبعت عنوان المرسل حتى مبنى تقرر هدمه."},{"en":"Inside, an elderly printer was hiding pages from a forbidden newspaper.","ar":"وجدت في الداخل طباعًا مسنًا يُخفي صفحات صحيفة محظورة."},{"en":"He said the letter was meant for Ruth’s sister, missing since the border closed.","ar":"قال إن الرسالة كانت موجهة إلى أخت روث المفقودة منذ إغلاق الحدود."},{"en":"“We are all living on borrowed time,” he added, and handed her a key.","ar":"وأضاف: «كلنا نعيش في وقت مستعار»، وناولها مفتاحًا."}]},{"title":"The Ordinary Route","titleAr":"الطريق العادي","paragraphs":[{"en":"The key opened a cabinet of print blocks, each marked with a date and a neighborhood.","ar":"فتح المفتاح خزانة قوالب طباعة، وُسم كل منها بتاريخ واسم حي."},{"en":"Together, the blocks revealed the route used by families passing messages through commercial shipments.","ar":"شكّلت القوالب معًا خريطة لمسار كانت العائلات تستخدمه لتمرير الرسائل عبر الشحنات التجارية."},{"en":"Ruth could have turned a blind eye and returned to her safe desk.","ar":"كان بإمكان روث أن تتغاضى عما اكتشفته وتعود إلى مكتبها الآمن."},{"en":"Instead, she memorized the route and burned the paper copy.","ar":"لكنها حفظت المسار عن ظهر قلب وأحرقت النسخة الورقية."},{"en":"Her first delivery reached a mother who had not heard from her son in eleven months.","ar":"وصل تسليمها الأول إلى أم لم يصلها خبر من ابنها منذ أحد عشر شهرًا."},{"en":"The woman read the letter without making a sound, then folded it into her coat.","ar":"قرأت المرأة الرسالة بصمت ثم طوتها داخل معطفها."},{"en":"Within weeks, the network carried dozens of messages, but a missing parcel drew official attention.","ar":"خلال أسابيع حملت الشبكة عشرات الرسائل، لكن اختفاء طرد واحد لفت انتباه السلطات."},{"en":"Ruth’s supervisor searched her desk and found a blank envelope with her sister’s name.","ar":"فتش مشرف روث مكتبها وعثر على ظرف فارغ يحمل اسم أختها."},{"en":"He told her that some letters were worth more than their paper.","ar":"قال لها إن بعض الرسائل تساوي أكثر من الورق الذي كُتبت عليه."}]},{"title":"The Last Delivery","titleAr":"التسليم الأخير","paragraphs":[{"en":"Ruth expected arrest, but the supervisor quietly returned the envelope.","ar":"توقعت روث الاعتقال، لكن المشرف أعاد إليها الظرف بهدوء."},{"en":"He had spent months looking for his own daughter on the other side.","ar":"كان قد أمضى أشهرًا يبحث عن ابنته على الجانب الآخر."},{"en":"The truth came to light when he admitted that he had signed off on the destruction orders.","ar":"ظهرت الحقيقة حين اعترف بأنه كان يوقّع أوامر الإتلاف."},{"en":"He could not undo those losses, but he could stop adding to them.","ar":"لم يكن يستطيع محو تلك الخسائر، لكنه كان قادرًا على وقف المزيد منها."},{"en":"Together, they redirected the next shipment to a charity warehouse beyond the checkpoint.","ar":"عملا معًا على تحويل الشحنة التالية إلى مستودع خيري بعد نقطة التفتيش."},{"en":"Among the deliveries was a letter from Ruth’s sister describing a life in a distant village.","ar":"كانت بين الرسائل رسالة من أخت روث تصف حياتها في قرية بعيدة."},{"en":"They would not meet that winter, and perhaps not the next, but now each knew the other was alive.","ar":"لم يكن مقدرًا لهما أن تلتقيا ذلك الشتاء، وربما لا الذي يليه، لكن كلًّا منهما عرفت أن الأخرى حية."},{"en":"Ruth placed the letter in the drawer where she had hidden the first messages.","ar":"وضعت روث الرسالة في الدرج الذي أخفت فيه الرسائل الأولى."},{"en":"For the first time, the drawer held something that had reached its destination.","ar":"وللمرة الأولى، احتفظ الدرج بشيء وصل بالفعل إلى وجهته."}]}],"terms":[{"term":"under the table","literal":"تحت الطاولة","context":"أخفت الرسائل تحت الطاولة حرفيًا؛ ويستعمل التعبير أيضًا للاتفاقات السرية","type":"phrase","note":"السياق هنا حرفي، لكنه قد يكون مجازيًا."},{"term":"on borrowed time","literal":"على وقت مستعار","context":"يعيش في فرصة مؤقتة قد تنتهي قريبًا","type":"idiom","note":"غالبًا في أوقات الخطر."},{"term":"turned a blind eye","literal":"حوّل عينًا عمياء","context":"تغاضت عمدًا عمّا يحدث","type":"idiom","note":"تعبير شائع عن التجاهل المتعمد."},{"term":"came to light","literal":"جاء إلى الضوء","context":"انكشف بعد أن كان مخفيًا","type":"idiom","note":"يُستخدم في الأخبار والتحقيق."},{"term":"signed off on","literal":"وقّع على","context":"اعتمد أو وافق رسميًا على قرار","type":"phrasal verb","note":"sign off on = يوافق/يعتمد."}]},{"id":"terms-of-silence","title":"Terms of Silence","subtitle":"Every contract leaves a trace.","genre":"contemporary","level":"C1","cover":"city","description":"A data analyst discovers her company has monetized the very complaints it promises to protect.","chapters":[{"title":"The Anonymous Box","titleAr":"صندوق الشكاوى المجهول","paragraphs":[{"en":"Every Friday, Iman read the workplace complaints no manager was supposed to identify.","ar":"كل جمعة، كانت إيمان تقرأ شكاوى الموظفين التي يُفترض ألا يعرف أي مدير أصحابها."},{"en":"Her company sold software that promised employees anonymity and safety.","ar":"كانت شركتها تبيع برنامجًا يعد الموظفين بالسرية والأمان."},{"en":"One complaint described a supervisor who had threatened to fire a pregnant colleague.","ar":"وصفت إحدى الشكاوى مشرفًا هدد بفصل زميلة حامل."},{"en":"The next morning, that colleague was dismissed for an unrelated reason.","ar":"وفي صباح اليوم التالي فُصلت تلك الزميلة بحجة لا علاقة لها بالشكوى."},{"en":"Iman checked the access logs and saw that her own account had opened the supposedly private report at midnight.","ar":"راجعت إيمان سجلات الوصول، فاكتشفت أن حسابها فتح التقرير الخاص عند منتصف الليل."},{"en":"She had been at home, where the electricity had failed for six hours.","ar":"كانت في منزلها آنذاك، حيث انقطعت الكهرباء ست ساعات."},{"en":"The security chief called the case a routine audit and asked her to drop it.","ar":"وصف رئيس الأمن القضية بأنها تدقيق روتيني وطلب منها أن تنسى الأمر."},{"en":"But his signature appeared on a contract creating a clear conflict of interest.","ar":"غير أن توقيعه ظهر على عقد يكشف تضارب مصالح واضحًا."},{"en":"The vendor that handled anonymous reports was owned by his brother.","ar":"فالشركة التي تعالج الشكاوى المجهولة كانت مملوكة لأخيه."}]},{"title":"The Missing Column","titleAr":"العمود المفقود","paragraphs":[{"en":"Iman found a hidden database column linking each complaint to an employee’s device.","ar":"عثرت إيمان على عمود مخفي في قاعدة البيانات يربط كل شكوى بجهاز موظف معين."},{"en":"The company had passed off surveillance as a feature designed for security.","ar":"كانت الشركة تسوّق المراقبة وكأنها ميزة هدفها الحماية."},{"en":"When she raised the issue internally, her manager offered her a promotion.","ar":"حين أثارت الأمر داخل الشركة عرض عليها مديرها ترقية."},{"en":"The offer came with a condition: she had to sign a statement denying any privacy problem.","ar":"لكن العرض كان مشروطًا بتوقيعها إفادة تنفي وجود أي انتهاك للخصوصية."},{"en":"Iman knew the promotion would fall through if she refused.","ar":"عرفت إيمان أن الترقية ستضيع إن رفضت."},{"en":"She copied only the evidence required to prove the system’s behavior, protecting colleagues’ identities.","ar":"نسخت فقط ما يلزم لإثبات سلوك النظام، مع حماية هويات زملائها."},{"en":"A lawyer helped her document the chain of custody before reporting the issue to regulators.","ar":"ساعدها محامٍ في توثيق سلسلة حيازة الأدلة قبل إبلاغ الجهات الرقابية."},{"en":"The firm tried to say the data had vanished without a trace.","ar":"حاولت الشركة الادعاء بأن البيانات اختفت دون أثر."},{"en":"But the access history told a different story, one written by the software itself.","ar":"غير أن سجل الوصول روى قصة أخرى، كتبها البرنامج بنفسه."}]},{"title":"Names Behind Numbers","titleAr":"أسماء خلف الأرقام","paragraphs":[{"en":"An independent investigation confirmed that managers could identify employees who filed complaints.","ar":"أكد تحقيق مستقل قدرة المديرين على معرفة هوية من يتقدمون بالشكاوى."},{"en":"The company suspended the system and notified affected workers.","ar":"أوقفت الشركة النظام وأبلغت الموظفين المتضررين."},{"en":"The dismissed colleague came forward, asking not for sympathy but for accountability.","ar":"تقدمت الزميلة المفصولة للإدلاء بشهادتها، لا طلبًا للشفقة بل للمساءلة."},{"en":"Iman testified too, explaining how an ordinary spreadsheet had concealed the abuse.","ar":"وشهدت إيمان أيضًا، موضحة كيف أخفى جدول بيانات عادي إساءة الاستخدام."},{"en":"Her career took an uncertain turn, and she could not pretend she was fearless.","ar":"دخلت مسيرتها المهنية منعطفًا مجهولًا، ولم تستطع الادعاء أنها بلا خوف."},{"en":"Still, she began work on a smaller tool that stored complaints only on devices controlled by the workers.","ar":"ومع ذلك بدأت تطوير أداة أصغر تحفظ الشكاوى فقط على أجهزة يسيطر عليها الموظفون."},{"en":"Her former colleagues volunteered to test it, questioning every promise she made.","ar":"تطوع زملاؤها السابقون لاختبارها، وفحصوا كل وعد تقدمه."},{"en":"Iman welcomed their skepticism; she had learned what trust without verification could cost.","ar":"رحبت إيمان بتشككهم؛ فقد تعلمت ثمن الثقة بلا تحقق."},{"en":"The new tool opened with a sentence she refused to make optional: “Know where your words go.”","ar":"كانت الأداة الجديدة تبدأ بجملة رفضت جعلها اختيارية: «اعرف أين تذهب كلماتك»."}]}],"terms":[{"term":"conflict of interest","literal":"تعارض المصالح","context":"تضارب مصالح يؤثر في الحياد","type":"noun phrase","note":"مصطلح شائع في الشركات."},{"term":"passed off","literal":"مرّر شيئًا","context":"قدّم المراقبة على أنها حماية","type":"phrasal verb","note":"pass off as = يمرر الشيء على أنه شيء آخر."},{"term":"fall through","literal":"يسقط خلالها","context":"يفشل اتفاق أو عرض قبل اكتماله","type":"phrasal verb","note":"خاصة الخطط والصفقات."},{"term":"without a trace","literal":"بلا أثر","context":"اختفى من دون ترك دليل ظاهر","type":"idiom","note":"تعبير شائع في الأخبار والأدب."},{"term":"came forward","literal":"تقدم إلى الأمام","context":"تقدّم للإدلاء بشهادة أو كشف معلومات","type":"phrasal verb","note":"في البلاغات والتحقيقات."}]},{"id":"tenant-upstairs","title":"The Tenant Upstairs","subtitle":"The ceiling remembers footsteps.","genre":"horror","level":"C1","cover":"house","description":"A sound designer moves into an apartment that has no upper floor, yet someone walks above him.","chapters":[{"title":"Footsteps Above","titleAr":"خطوات فوق السقف","paragraphs":[{"en":"The apartment was cheap because the building had been condemned and then inexplicably cleared for rent.","ar":"كانت الشقة رخيصة لأن المبنى أُدين بعدم الصلاحية للسكن، ثم سُمح بتأجيره لأسباب غامضة."},{"en":"Sound designer Sami noticed the smell of damp wood before he noticed the footsteps.","ar":"لاحظ مصمم الصوت سامي رائحة الخشب الرطب قبل أن يسمع وقع الخطوات."},{"en":"Each night, someone crossed the ceiling at exactly 1:06, although his flat occupied the top floor.","ar":"كل ليلة عند الواحدة وست دقائق كان أحدهم يعبر سقفه، رغم أن شقته في الطابق الأخير."},{"en":"He put a recorder on the table, expecting a loose pipe or birds in the roof.","ar":"وضع جهاز تسجيل على الطاولة، متوقعًا أن يكون الصوت من أنبوب مرتخٍ أو طيور تحت السقف."},{"en":"On playback, the footsteps were clear, followed by his own voice saying a sentence he had never spoken.","ar":"عند تشغيل التسجيل كانت الخطوات واضحة، تلتها جملة بصوته هو، لم ينطقها في حياته."},{"en":"The voice said, “Do not make a room for what you have forgotten.”","ar":"قال الصوت: «لا تفسح مكانًا لما نسيتَه». "},{"en":"Sami examined the recording for manipulation, but the hidden frequency was out of place among ordinary room sounds.","ar":"فحص سامي التسجيل بحثًا عن تلاعب، لكن ترددًا خفيًا بدا غريبًا وسط أصوات الغرفة العادية."},{"en":"The landlord insisted nobody had lived there in decades.","ar":"أصرّ المالك على أن أحدًا لم يسكن المكان منذ عقود."},{"en":"At sunrise, Sami found wet footprints on the ceiling, each one pointing toward the locked attic hatch.","ar":"عند الشروق وجد آثار أقدام مبتلة على السقف، تشير كلها إلى فتحة علّية مقفلة."}]},{"title":"The Room Between","titleAr":"الغرفة بين الطوابق","paragraphs":[{"en":"For days he stayed on edge, sleeping in short intervals and checking the ceiling whenever he woke.","ar":"بقي أيامًا متوترًا، ينام على فترات قصيرة ويفحص السقف كلما استيقظ."},{"en":"A neighbor admitted that the building had once contained a listening room between two floors.","ar":"اعترف جار بأن المبنى احتوى قديمًا على غرفة تنصت بين طابقين."},{"en":"Its walls were designed to hold sound so perfectly that voices seemed to emerge years after they were spoken.","ar":"صُممت جدرانها لحبس الصوت بإحكام حتى بدا أن الأصوات تخرج منها بعد سنوات من صدورها."},{"en":"Sami had always been drawn to abandoned places, but this one seemed to be listening back.","ar":"لطالما انجذب سامي إلى الأماكن المهجورة، لكن هذا المكان بدا وكأنه يستمع إليه أيضًا."},{"en":"He forced open the attic hatch and crawled into a narrow chamber lined with dark acoustic panels.","ar":"فتح باب العلّية بالقوة وزحف إلى غرفة ضيقة مبطنة بألواح عزل صوتي داكنة."},{"en":"A chair stood beneath a small lamp, and a reel of tape carried his full name.","ar":"كان كرسي يقف تحت مصباح صغير، وعلى شريط تسجيل اسمه الكامل."},{"en":"The tape contained interviews with people who had disappeared from the building years before.","ar":"احتوى الشريط مقابلات لأشخاص اختفوا من المبنى قبل سنوات."},{"en":"The final voice was his mother’s, asking a child named Sami to stay perfectly still.","ar":"وكان الصوت الأخير لأمه، تطلب من طفل اسمه سامي ألا يتحرك مطلقًا."},{"en":"He had grown up believing she had left without saying goodbye.","ar":"كان قد نشأ معتقدًا أنها رحلت من دون وداع."}]},{"title":"The Silence We Keep","titleAr":"الصمت الذي نحتفظ به","paragraphs":[{"en":"Sami sat in the dark and listened to the recording twice, resisting the urge to fill the gaps with guesses.","ar":"جلس سامي في الظلام واستمع إلى التسجيل مرتين، مقاومًا رغبته في ملء الفراغات بالتخمين."},{"en":"His mother had been documenting forced disappearances; she hid him here during a raid.","ar":"كانت أمه توثق حالات اختفاء قسري، وقد أخفته هناك أثناء مداهمة."},{"en":"The voices were not ghosts, but the building had preserved evidence that others wanted erased.","ar":"لم تكن الأصوات أشباحًا، بل احتفظ المبنى بأدلة أراد آخرون محوها."},{"en":"The footsteps came from a mechanical timer striking beams under the roof.","ar":"كانت الخطوات صادرة عن مؤقت ميكانيكي يضرب عوارض تحت السقف."},{"en":"Whoever built it had wanted someone curious enough to investigate.","ar":"كان من صنعه يريد أن يأتي شخص فضولي بما يكفي ليتحقق."},{"en":"Sami copied the recordings and delivered them to a legal archive rather than releasing them publicly.","ar":"نسخ سامي التسجيلات وسلمها إلى أرشيف قانوني بدل نشرها للعموم."},{"en":"He understood that survivors should not be at the mercy of a stranger’s need for a dramatic ending.","ar":"أدرك أن الناجين يجب ألا يكونوا تحت رحمة حاجة غريب إلى نهاية مثيرة."},{"en":"When he returned for his belongings, the ceiling was silent for the first time.","ar":"حين عاد لأخذ أغراضه، كان السقف صامتًا للمرة الأولى."},{"en":"He left the apartment in the dark, carrying the only sound he had ever feared losing: his mother’s voice.","ar":"غادر الشقة في الظلام حاملًا الصوت الوحيد الذي خشي يومًا أن يفقده: صوت أمه."}]}],"terms":[{"term":"out of place","literal":"خارج المكان","context":"غير منسجم مع الأصوات المعتادة","type":"idiom","note":"قد يصف شيئًا أو شخصًا."},{"term":"on edge","literal":"على الحافة","context":"متوتر وفي حالة تأهب","type":"idiom","note":"يشيع بعد القلق الطويل."},{"term":"drawn to","literal":"منجذب إلى","context":"يشعر بانجذاب قوي إلى أماكن معينة","type":"phrase","note":"be drawn to someone/something."},{"term":"in the dark","literal":"في الظلام","context":"دون إضاءة في السياق؛ وقد يعني عدم المعرفة","type":"idiom","note":"معناه يعتمد على السياق."},{"term":"at the mercy of","literal":"تحت رحمة","context":"غير قادر على حماية نفسه من قرارات طرف آخر","type":"idiom","note":"يستخدم مع القوى أو الأشخاص."}]},{"id":"missing-photograph","title":"The Missing Photograph","genre":"mystery","level":"B2","subtitle":"The past leaves a negative.","description":"An investigative photographer receives an image of a crime that has not occurred yet.","cover":"noir","chapters":[{"title":"A Picture From Tomorrow","titleAr":"صورة من الغد","paragraphs":[{"en":"The envelope had no return address, only an old photograph of a station clock showing six seventeen.","ar":"لم يحمل الظرف عنوان مرسل؛ كانت فيه صورة قديمة لساعة محطة تشير إلى السادسة وسبع عشرة دقيقة."},{"en":"In the foreground, a woman lay beside an overturned bicycle. Mara recognized the woman: it was herself.","ar":"في مقدمة الصورة، كانت امرأة ملقاة قرب دراجة انقلبت. تعرّفت مارا إلى المرأة: كانت هي نفسها."},{"en":"The paper smelled of chemicals, and the date on the back was tomorrow's. She checked it twice.","ar":"كانت رائحة المواد الكيميائية عالقة بالورق، والتاريخ المكتوب خلفه يعود إلى الغد. راجعته مرتين."},{"en":"A sensible person would have stayed home. Mara picked up her camera instead.","ar":"كان الشخص العاقل سيبقى في المنزل. أما مارا، فحملت كاميرتها."}]},{"title":"The Wrong Platform","titleAr":"الرصيف الخطأ","paragraphs":[{"en":"The station was nearly empty when she arrived. At six sixteen, a cyclist appeared beneath the clock.","ar":"كانت المحطة شبه خالية عند وصولها. في السادسة وست عشرة دقيقة، ظهر راكب دراجة تحت الساعة."},{"en":"He wore her brother's coat, the one he had been buried in three years earlier.","ar":"كان يرتدي معطف أخيها، المعطف الذي دُفن به قبل ثلاث سنوات."},{"en":"Mara called out. The cyclist turned, and his face was hidden behind a camera identical to hers.","ar":"نادته مارا. استدار راكب الدراجة، لكن وجهه كان خلف كاميرا مطابقة لكاميرتها."},{"en":"The shutter clicked. A bicycle fell. The station clock stopped at six seventeen.","ar":"صدر صوت التقاط الصورة. وسقطت الدراجة، وتوقفت ساعة المحطة عند السادسة وسبع عشرة دقيقة."}]},{"title":"The Developed Truth","titleAr":"الحقيقة بعد تحميض الصورة","paragraphs":[{"en":"She opened her eyes on the platform, unhurt. The stranger was gone, but the fresh photograph lay at her feet.","ar":"فتحت عينيها على الرصيف دون إصابة. اختفى الغريب، لكن الصورة الجديدة كانت عند قدميها."},{"en":"It showed the same clock, the same bicycle, and a child standing where she had stood a moment before.","ar":"أظهرت الصورة الساعة نفسها والدراجة نفسها، وطفلًا يقف في المكان الذي كانت تقف فيه قبل لحظات."},{"en":"On the back someone had written: Every warning changes who receives the next one.","ar":"كتب أحدهم خلفها: كل تحذير يغيّر الشخص الذي سيصله التحذير التالي."},{"en":"Mara took the child by the hand before the minute could turn.","ar":"أمسكت مارا بيد الطفل قبل أن تتبدل الدقيقة."}]}],"terms":[{"term":"return address","literal":"عنوان المرسل","context":"عنوان المرسل على الظرف","type":"collocation","note":"مفردة بريدية شائعة."},{"term":"in the foreground","literal":"في المقدمة","context":"في الجزء الأمامي من الصورة","type":"phrase","note":"مقابل in the background."},{"term":"called out","literal":"نادى بصوت مرتفع","context":"نادت لتنبه الشخص البعيد","type":"phrasal verb","note":"تعبير طبيعي للسرد."},{"term":"shutter clicked","literal":"نقرت غالق الكاميرا","context":"صدر صوت التقاط الصورة","type":"collocation","note":"في وصف التصوير."}]},{"id":"memory-tax","title":"The Memory Tax","genre":"sci_fi","level":"C1","subtitle":"Nothing personal is free.","description":"In a city where memories pay the rent, an archivist finds an impossible receipt.","cover":"noir","chapters":[{"title":"Monthly Deductions","titleAr":"اقتطاعات شهرية","paragraphs":[{"en":"Every tenant in the city paid rent in memories. Landlords preferred birthdays, first kisses, and moments of triumph.","ar":"كان سكان المدينة يدفعون الإيجار بذكرياتهم. وكان المالكون يفضّلون أعياد الميلاد والقبلات الأولى ولحظات الانتصار."},{"en":"Nadia worked at the Memory Office, making sure nobody sold the same afternoon twice.","ar":"عملت نادية في مكتب الذكريات، حيث تتأكد ألا يبيع أحدهم ظهيرة واحدة مرتين."},{"en":"One morning, a receipt appeared on her desk for a memory she had never lived.","ar":"ذات صباح، وجدت على مكتبها إيصالًا لذكرى لم تعشها قط."},{"en":"Its description read: The day the ocean returned to the city.","ar":"كان وصفها: اليوم الذي عاد فيه البحر إلى المدينة."}]},{"title":"The Unpaid Balance","titleAr":"الرصيد غير المدفوع","paragraphs":[{"en":"There had been no ocean here for a hundred years. She opened the receipt and saw herself standing underwater.","ar":"لم يكن هناك بحر في هذا المكان منذ مئة عام. فتحت الإيصال ورأت نفسها واقفة تحت الماء."},{"en":"A little boy was beside her, waving toward a glass ceiling that held the sea above the streets.","ar":"كان قربها طفل صغير يلوّح نحو سقف زجاجي يحمل البحر فوق الشوارع."},{"en":"Nadia had no son. But the boy spoke her name with the certainty of someone who had said it every day.","ar":"لم يكن لنادية ابن. لكن الطفل نطق اسمها بيقين من يناديها كل يوم."},{"en":"She searched the register. Her future had been sold by the city council as collateral.","ar":"بحثت في السجل. لقد باع مجلس المدينة مستقبلها بوصفه ضمانًا لدين."}]},{"title":"A Different Currency","titleAr":"عملة أخرى","paragraphs":[{"en":"The city had borrowed against tomorrow, and its citizens would pay with experiences they had not yet had.","ar":"اقترضت المدينة على حساب الغد، وسيدفع سكانها الثمن بتجارب لم يعيشوها بعد."},{"en":"Nadia published the ledger. The streets filled with people demanding their unwritten lives back.","ar":"نشرت نادية دفتر الحسابات. وامتلأت الشوارع بأناس يطالبون باستعادة حياتهم التي لم تُكتب بعد."},{"en":"That evening, the first rain in decades struck the glass roof. The sound was almost like applause.","ar":"في تلك الليلة، هطل أول مطر منذ عقود فوق السقف الزجاجي. وكان صوته أشبه بالتصفيق."},{"en":"For the first time, she remembered something that had not been taken away.","ar":"ولأول مرة، تذكّرت شيئًا لم يُنتزع منها."}]}],"terms":[{"term":"making sure","literal":"التأكد","context":"التأكد من عدم تكرار البيع","type":"phrase","note":"يُستخدم للتأكد من نتيجة."},{"term":"held the sea","literal":"حمل البحر","context":"أبقى البحر معلّقًا فوق الشوارع","type":"metaphor","note":"صورة مجازية في سياق الخيال العلمي."},{"term":"as collateral","literal":"كضمان","context":"كضمان مالي على الديون","type":"phrase","note":"لغة مالية وقانونية."},{"term":"borrowed against tomorrow","literal":"اقترض على حساب الغد","context":"استهلك موارد المستقبل مقدمًا","type":"idiom","note":"تعبير مجازي عن استنزاف المستقبل."}]},{"id":"apartment-across","title":"The Apartment Across","genre":"psychological","level":"B2","subtitle":"Somebody has your routine.","description":"A translator notices a stranger across the street copying every detail of her life.","cover":"noir","chapters":[{"title":"The Same Cup","titleAr":"الفنجان نفسه","paragraphs":[{"en":"Lena first noticed the woman across the street on a Wednesday morning. She was drinking from an identical yellow cup.","ar":"لاحظت لينا المرأة في البناية المقابلة صباح الأربعاء لأول مرة. كانت تشرب من فنجان أصفر مطابق لفنجانها."},{"en":"When Lena stood up, the woman stood up. When she drew the curtains, the other window went dark.","ar":"حين وقفت لينا، وقفت المرأة أيضًا. وحين أغلقت الستائر، أظلمت النافذة المقابلة."},{"en":"Coincidence, she told herself, though she did not believe it.","ar":"قالت لنفسها إنها مصادفة، لكنها لم تصدّق ذلك."},{"en":"At midnight, the stranger held up a sign that said: Stop translating the letters.","ar":"عند منتصف الليل، رفعت الغريبة لافتة كُتب عليها: توقفي عن ترجمة الرسائل."}]},{"title":"A Sentence Removed","titleAr":"جملة محذوفة","paragraphs":[{"en":"Lena translated court documents for a living. That week she had been given a sealed collection of witness statements.","ar":"كانت لينا تترجم وثائق المحاكم لقاء أجر. وفي ذلك الأسبوع، تسلّمت مجموعة مغلقة من إفادات الشهود."},{"en":"Each statement contained a sentence the client wanted deleted. She had kept copies out of habit.","ar":"احتوت كل إفادة على جملة طلب العميل حذفها. وكانت قد احتفظت بنسخ منها بحكم العادة."},{"en":"Now she reread the missing sentences. Together they described her home, her routines, and the woman in the window.","ar":"عادت وقرأت الجمل المحذوفة. وعند جمعها، وجدت أنها تصف منزلها وعاداتها والمرأة خلف النافذة."},{"en":"The last sentence had not been translated yet: Tomorrow one of them will disappear.","ar":"أما الجملة الأخيرة فلم تكن قد ترجمتها بعد: غدًا ستختفي إحداهما."}]},{"title":"The Other Side","titleAr":"الجهة الأخرى","paragraphs":[{"en":"She crossed the street carrying the documents. The building opposite had been empty for ten years.","ar":"عبرت الشارع وهي تحمل الوثائق. كانت البناية المقابلة مهجورة منذ عشر سنوات."},{"en":"Inside, the apartment was arranged exactly like hers, down to the crack in the kitchen tile.","ar":"في الداخل، وجدت الشقة مرتبة تمامًا كشقتها، حتى الشق الصغير في بلاطة المطبخ."},{"en":"A yellow cup sat on the table. Beside it lay a translation bearing her signature, dated next week.","ar":"كان فنجان أصفر على الطاولة. وإلى جانبه ترجمة تحمل توقيعها، بتاريخ الأسبوع المقبل."},{"en":"From across the street, someone pulled her own curtains shut.","ar":"ومن الجهة المقابلة للشارع، أغلق أحدهم ستائر شقتها هي."}]}],"terms":[{"term":"for a living","literal":"من أجل المعيشة","context":"كمهنة ومصدر رزق","type":"idiom","note":"What do you do for a living?"},{"term":"out of habit","literal":"بحكم العادة","context":"بشكل تلقائي بسبب عادة قديمة","type":"phrase","note":"تعبير يومي طبيعي."},{"term":"down to","literal":"نزولًا إلى","context":"حتى أدق التفاصيل","type":"phrase","note":"لتأكيد دقة التطابق."},{"term":"bearing her signature","literal":"حاملةً توقيعها","context":"تحمل توقيعها الرسمي","type":"collocation","note":"صياغة رسمية أو سردية."}]},{"id":"last-typesetter","title":"The Last Typesetter","genre":"historical","level":"C1","subtitle":"One letter can change history.","description":"In 1937, a printer risks his family to correct a lie before morning.","cover":"noir","chapters":[{"title":"Ink After Curfew","titleAr":"حبر بعد
