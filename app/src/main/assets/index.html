حظر التجول","paragraphs":[{"en":"The printing press shook beneath the floorboards of a narrow shop. Every strike of metal type sounded like a footstep.","ar":"كانت المطبعة تهتز تحت أرضية متجر ضيق. وكل طرقة لحروف الرصاص بدت كأنها وقع أقدام."},{"en":"In 1937, Elias printed government notices by day and anonymous letters by night.","ar":"في عام 1937، كان إلياس يطبع الإعلانات الحكومية نهارًا والرسائل المجهولة ليلًا."},{"en":"That night, an official arrived with a statement announcing the death of a famous political prisoner.","ar":"في تلك الليلة، وصل مسؤول حاملًا بيانًا يعلن وفاة سجين سياسي معروف."},{"en":"The paper was already signed, but the date of death was three days in the future.","ar":"كان البيان موقّعًا مسبقًا، لكن تاريخ الوفاة فيه بعد ثلاثة أيام."}]},{"title":"The Unprinted Line","titleAr":"السطر الذي لم يُطبع","paragraphs":[{"en":"Elias could print the notice and pretend he had not seen the date. His daughter would remain safe.","ar":"كان إلياس يستطيع طباعة البيان والتظاهر بأنه لم يلاحظ التاريخ. وهكذا تبقى ابنته آمنة."},{"en":"Instead, he set a single new line beneath the official announcement: He is alive today.","ar":"لكنه أضاف سطرًا واحدًا تحت الإعلان الرسمي: إنه حي اليوم."},{"en":"His apprentice protested that the extra words would expose them both. Elias knew he was right.","ar":"اعترض متدرّبه قائلًا إن الكلمات الإضافية ستفضحهما معًا. وكان إلياس يعرف أنه محق."},{"en":"They worked through the night, folding one thousand pages before the first patrol came.","ar":"واصلا العمل طوال الليل، وطويا ألف صفحة قبل وصول أول دورية."}]},{"title":"A Thousand Witnesses","titleAr":"ألف شاهد","paragraphs":[{"en":"At dawn, the notices appeared on every wall. The officials tore them down, but the extra line spread faster than fire.","ar":"عند الفجر ظهرت الإعلانات على كل جدار. مزّقها المسؤولون، لكن السطر الإضافي انتشر كالنار."},{"en":"People began asking questions that had been dangerous to ask only yesterday.","ar":"بدأ الناس يطرحون أسئلة كان مجرد طرحها خطرًا بالأمس."},{"en":"Elias lost his press. Yet when he reached home, he found a fresh stack of paper on his doorstep.","ar":"خسر إلياس مطبعته. لكنه حين عاد إلى منزله وجد رزمة أوراق جديدة عند بابه."},{"en":"At the top, in unfamiliar handwriting, were four words: We will keep printing.","ar":"في أعلى الرزمة، وبخط لا يعرفه، كُتبت أربع كلمات: سنواصل الطباعة."}]}],"terms":[{"term":"floorboards","literal":"ألواح الأرضية","context":"الأخشاب التي تغطي أرضية المحل","type":"noun","note":"اسم جمع يرد في الوصف المعماري."},{"term":"by day","literal":"نهارًا","context":"خلال ساعات النهار","type":"phrase","note":"غالبًا يقابله by night."},{"term":"pretend","literal":"تظاهر","context":"تظاهر بأنه لم يلاحظ الحقيقة","type":"verb","note":"ليس معناه الادعاء دائمًا بنفس النبرة."},{"term":"tore them down","literal":"مزّقها / نزعها","context":"أزال المنشورات المعلقة بالقوة","type":"phrasal verb","note":"من tear down."}]},{"id":"quiet-resignation","title":"The Quiet Resignation","genre":"contemporary","level":"B2","subtitle":"A farewell email is not the end.","description":"An exhausted analyst uncovers why her colleagues keep vanishing from the company directory.","cover":"noir","chapters":[{"title":"A Draft Never Sent","titleAr":"مسودة لم تُرسل","paragraphs":[{"en":"Amal had rewritten her resignation email eleven times. Each version sounded either too angry or too grateful.","ar":"أعادت أمل صياغة رسالة استقالتها إحدى عشرة مرة. كانت كل نسخة إما غاضبة أكثر من اللازم أو ممتنة أكثر مما ينبغي."},{"en":"At midnight, a message appeared from a colleague whose account had been deleted months earlier.","ar":"عند منتصف الليل، وصلتها رسالة من زميل حُذف حسابه قبل أشهر."},{"en":"The subject line read: Before you leave, open the attendance records.","ar":"كان عنوان الرسالة: قبل أن ترحلي، افتحي سجلات الحضور."},{"en":"She clicked the attachment and saw her own name listed as present on days she had never worked.","ar":"فتحت المرفق فرأت اسمها مسجلًا ضمن الحاضرين في أيام لم تعمل فيها أصلًا."}]},{"title":"Nobody Absent","titleAr":"لا أحد غائب","paragraphs":[{"en":"The company had been billing customers for employees who no longer existed on the payroll.","ar":"كانت الشركة تفرض على العملاء رسوم عمل موظفين لم يعودوا موجودين أصلًا في كشوف الرواتب."},{"en":"Amal traced the invoices to a senior manager who had praised her attention to detail.","ar":"تتبعت أمل الفواتير حتى وصلت إلى مدير كبير لطالما مدح دقتها في العمل."},{"en":"He called before sunrise and offered a promotion. She asked him to put the offer in writing.","ar":"اتصل قبل شروق الشمس وعرض عليها ترقية. طلبت منه توثيق العرض كتابة."},{"en":"The document he sent contained a confidentiality clause and a number with too many zeros.","ar":"احتوت الوثيقة التي أرسلها على بند سرية ومبلغ ضخم بأصفار كثيرة."}]},{"title":"An Ordinary Monday","titleAr":"اثنين عادي","paragraphs":[{"en":"On Monday morning, Amal arrived with two copies of the invoices and her unsigned resignation.","ar":"صباح الاثنين وصلت أمل ومعها نسختان من الفواتير ورسالة استقالتها غير الموقعة."},{"en":"She handed one copy to an independent auditor and the other to the workers' representatives.","ar":"سلّمت نسخة إلى مدقق مستقل والأخرى إلى ممثلي العاملين."},{"en":"By lunchtime, the manager had disappeared from the directory. This time, nobody called it an error.","ar":"بحلول الغداء، اختفى اسم المدير من دليل الموظفين. هذه المرة لم يقل أحد إنها غلطة تقنية."},{"en":"Amal finally sent her resignation. It contained only two sentences, and neither was an apology.","ar":"أرسلت أمل استقالتها أخيرًا. كانت من جملتين فقط، ولم تكن أي منهما اعتذارًا."}]}],"terms":[{"term":"resignation","literal":"استقالة","context":"طلب رسمي لإنهاء العمل","type":"noun","note":"شائعة في بيئة العمل."},{"term":"attendance records","literal":"سجلات الحضور","context":"سجلات دوام الموظفين","type":"collocation","note":"لغة إدارية."},{"term":"put the offer in writing","literal":"ضع العرض كتابة","context":"قدّم العرض بشكل رسمي موثّق","type":"idiom","note":"طلب شائع قبل قبول عرض."},{"term":"confidentiality clause","literal":"بند السرية","context":"شرط قانوني يمنع إفشاء معلومات","type":"collocation","note":"لغة العقود."}]},{"id":"room-low-tide","title":"The Room at Low Tide","genre":"horror","level":"C1","subtitle":"The sea knows your name.","description":"A coastal hotel keeps one door locked until the ocean withdraws.","cover":"noir","chapters":[{"title":"The Door Below","titleAr":"الباب السفلي","paragraphs":[{"en":"The hotel owner warned Noor never to take the basement stairs after sunset. The building stood far above the beach.","ar":"حذّر صاحب الفندق نور من النزول إلى القبو بعد الغروب. كان المبنى قائمًا على ارتفاع كبير فوق الشاطئ."},{"en":"On the first night, salt water began seeping beneath her bedroom door, though the carpet outside was dry.","ar":"في الليلة الأولى، بدأت مياه مالحة تتسرب من تحت باب غرفتها، رغم أن السجاد في الخارج كان جافًا."},{"en":"She followed the wet footprints downstairs. They ended at a door painted the color of old bone.","ar":"تتبعت آثار الأقدام المبتلة نزولًا على الدرج. وانتهت عند باب بلون العظام القديمة."},{"en":"From behind it came her mother's voice, asking why she had been left alone.","ar":"ومن خلفه جاء صوت أمها يسأل لماذا تُركت وحيدة."}]},{"title":"Low Tide","titleAr":"عند الجَزْر","paragraphs":[{"en":"Her mother had died twenty years earlier, nowhere near the sea. Noor pressed an ear against the door.","ar":"كانت أمها قد توفيت قبل عشرين عامًا بعيدًا عن البحر. ألصقت نور أذنها بالباب."},{"en":"Someone on the other side was counting slowly in a language Noor had spoken only as a child.","ar":"كان شخص على الجهة الأخرى يعدّ ببطء بلغة لم تتحدث بها نور منذ طفولتها."},{"en":"She stepped back when the water retreated, leaving a line of shells in the shape of her name.","ar":"تراجعت حين انسحب الماء تاركًا صفًا من الأصداف على هيئة حروف اسمها."},{"en":"At dawn the hotel owner found her waiting on the stairs, clutching the rusted key she had never touched.","ar":"وعند الفجر وجدها صاحب الفندق تنتظر على الدرج وتقبض على مفتاح صدئ لم تلمسه من قبل."}]},{"title":"The Guest Register","titleAr":"سجل النزلاء","paragraphs":[{"en":"The owner opened an old register and turned it toward her. Her name appeared beside a room number in ink faded by decades.","ar":"فتح المالك سجلًا قديمًا وأداره نحوها. كان اسمها مكتوبًا بجانب رقم غرفة بحبر أبهتته العقود."},{"en":"The arrival date was the day before she was born. The departure date had been left blank.","ar":"كان تاريخ الوصول قبل يوم من ولادتها. أما تاريخ المغادرة فكان فارغًا."},{"en":"Downstairs, the door opened without a sound. Somewhere deep below the foundation, waves applauded an arrival.","ar":"في الأسفل، انفتح الباب دون صوت. وفي مكان عميق تحت الأساسات، بدا الموج كأنه يصفّق لوصول أحدهم."},{"en":"Noor closed the register and wrote one word beside her name: Departed.","ar":"أغلقت نور السجل وكتبت كلمة واحدة بجانب اسمها: غادرت."}]}],"terms":[{"term":"seeping","literal":"يتسرّب","context":"تتسلل المياه ببطء عبر شق","type":"verb","note":"يستعمل للسوائل."},{"term":"low tide","literal":"الجزر","context":"انحسار مياه البحر","type":"noun","note":"يقابله high tide المدّ."},{"term":"clutching","literal":"يقبض بشدة","context":"تتشبث بالمفتاح خوفًا","type":"verb","note":"أقوى من holding."},{"term":"left blank","literal":"تُرك فارغًا","context":"لم يُكتب فيه أي تاريخ","type":"phrase","note":"في الاستمارات والسجلات."}]},{"id":"red-envelope","title":"The Red Envelope","genre":"mystery","level":"B2","subtitle":"The verdict came early.","description":"A juror receives an unsigned note predicting the outcome of a trial before the evidence is heard.","cover":"editorial","chapters":[{"title":"A Different Verdict","titleAr":"حكم مختلف","paragraphs":[{"en":"The red envelope arrived on the morning the jury was due to meet. It contained a single word: Guilty.","ar":"وصل الظرف الأحمر صباح اجتماع هيئة المحلفين. لم يكن بداخله سوى كلمة واحدة: مذنب."},{"en":"Nora was not supposed to discuss the case with anyone. She put the note into her bag and said nothing.","ar":"لم يكن يُسمح لنورا بمناقشة القضية مع أحد. دسّت الورقة في حقيبتها ولم تقل شيئًا."},{"en":"During the hearing, the witness repeated a detail that only the investigators knew. Nora felt the paper against her hand.","ar":"أثناء الجلسة، كرر الشاهد تفصيلًا لم يكن يعرفه إلا المحققون. وشعرت نورا بالورقة تلامس يدها."},{"en":"The prosecutor smiled as though the outcome had already been settled.","ar":"ابتسم المدعي العام كأن النتيجة حُسمت مسبقًا."}]},{"title":"The Second Envelope","titleAr":"الظرف الثاني","paragraphs":[{"en":"After lunch, another envelope appeared beneath her chair. This one contained a photograph of the prosecutor accepting money.","ar":"بعد الغداء، ظهر ظرف آخر تحت كرسيها. احتوى هذه المرة صورة للمدعي العام وهو يتسلم مالًا."},{"en":"On the back someone had written: The truth is not the same as the verdict.","ar":"كتب شخص على ظهرها: الحقيقة ليست دائمًا ما يقوله الحكم."},{"en":"Nora asked to speak to the judge in private. Her voice shook, but she handed over both envelopes.","ar":"طلبت نورا الحديث مع القاضي على انفراد. كان صوتها يرتجف، لكنها سلّمته الظرفين."},{"en":"The hearing stopped. Before leaving, the prosecutor looked straight at her and whispered: You are late.","ar":"توقفت الجلسة. وقبل أن يغادر، نظر إليها المدعي مباشرة وهمس: لقد تأخرتِ."}]},{"title":"The Blank Paper","titleAr":"الورقة البيضاء","paragraphs":[{"en":"The investigation uncovered a network of people who had been buying verdicts for years.","ar":"كشف التحقيق عن شبكة تشتري الأحكام منذ سنوات."},{"en":"When Nora returned home, a final red envelope waited on the table. Its pages were completely blank.","ar":"وحين عادت نورا إلى منزلها، كان ظرف أحمر أخير ينتظر على الطاولة. لم تكن في أوراقه أي كتابة."},{"en":"Then her phone rang. A voice said, 'We wanted to know whether you would choose the evidence or the answer.'","ar":"ثم رنّ هاتفها، وقال صوت: أردنا أن نعرف إن كنت ستختارين الدليل أم الجواب الجاهز."},{"en":"She set the empty pages beside her notes and began writing her own account.","ar":"وضعت الصفحات الفارغة بجانب ملاحظاتها، وبدأت تكتب شهادتها بنفسها."}]}],"terms":[{"term":"due to","literal":"من المقرر أن","context":"كان موعد اجتماع الهيئة قد حان","type":"phrase","note":"تعبر عن حدث مجدول."},{"term":"settled","literal":"مُسوّى / محسوم","context":"كأن الحكم تحدد مسبقًا","type":"verb","note":"معنى يتغير حسب السياق."},{"term":"in private","literal":"على انفراد","context":"دون حضور الآخرين","type":"phrase","note":"شائع في العمل والمحاكم."},{"term":"uncovered","literal":"كشف","context":"كشف التحقيق شبكة فساد","type":"verb","note":"للمعلومات المخفية."}]},{"id":"last-weather-report","title":"The Last Weather Report","genre":"sci_fi","level":"B2","subtitle":"Tomorrow has already passed.","description":"A climate station transmits forecasts from an Earth that no longer exists.","cover":"editorial","chapters":[{"title":"Forecast: Clear","titleAr":"التوقعات: صحو","paragraphs":[{"en":"The remote station sent one weather report every day, even after the people who built it had disappeared.","ar":"أرسلت المحطة النائية تقرير طقس كل يوم، حتى بعد اختفاء الذين بنوها."},{"en":"Leila maintained its equipment alone. Her assignment was simple: keep the transmitter alive until the rescue ship arrived.","ar":"كانت ليلى تصون أجهزتها وحدها. مهمتها بسيطة: إبقاء جهاز الإرسال يعمل حتى تصل سفينة الإنقاذ."},{"en":"One night the screen displayed a forecast for a city that had been destroyed fifty years before.","ar":"ذات ليلة ظهر على الشاشة توقع لمدينة دُمرت قبل خمسين عامًا."},{"en":"It predicted warm rain, crowded streets, and a parade through the old square.","ar":"تنبأ بمطر دافئ وشوارع مزدحمة وموكب يعبر الساحة القديمة."}]},{"title":"The City in the Static","titleAr":"المدينة داخل التشويش","paragraphs":[{"en":"Leila increased the signal strength and heard the murmur of thousands of voices through the static.","ar":"رفعت ليلى قوة الإشارة، وسمعت همهمة آلاف الأصوات وسط التشويش."},{"en":"The old city was not broadcasting from the past. It was broadcasting from a different version of tomorrow.","ar":"لم تكن المدينة القديمة تبث من الماضي، بل من نسخة مختلفة من الغد."},{"en":"A meteorologist answered her call. He said her station was the place shown in his forecasts as an empty crater.","ar":"ردّ عليها خبير أرصاد، وأخبرها أن محطتها تظهر في توقعاته حفرةً خالية."},{"en":"Each world, Leila realized, was warning the other about a disaster that had not happened there yet.","ar":"أدركت ليلى أن كل عالم يحذّر الآخر من كارثة لم تقع فيه بعد."}]},{"title":"A Better Forecast","titleAr":"توقع أفضل","paragraphs":[{"en":"She sent the station's evacuation plans through the signal. The meteorologist sent back the location of a safe valley.","ar":"أرسلت خطط الإخلاء عبر الإشارة، وأعاد إليها خبير الأرصاد موقع وادٍ آمن."},{"en":"By morning, the rescue ship had changed course. On the screen, the parade had been cancelled.","ar":"بحلول الصباح غيّرت سفينة الإنقاذ مسارها. وعلى الشاشة أُلغي الموكب."},{"en":"The two worlds would never meet, but each had borrowed a few hours from the other.","ar":"لن يلتقي العالمان أبدًا، لكن كلًا منهما استعار ساعات قليلة من الآخر."},{"en":"Leila typed the first forecast she truly believed: A chance of survival.","ar":"كتبت ليلى أول توقع تؤمن به حقًا: هناك فرصة للنجاة."}]}],"terms":[{"term":"assignment","literal":"تكليف / مهمة","context":"مهمتها الرسمية في المحطة","type":"noun","note":"شائع في العمل والدراسة."},{"term":"through the static","literal":"عبر التشويش","context":"بين أصوات التداخل في الإشارة","type":"phrase","note":"للاتصالات اللاسلكية."},{"term":"changed course","literal":"غيّر المسار","context":"غيّرت السفينة اتجاهها","type":"idiom","note":"حرفيًا ومجازيًا."},{"term":"a chance of","literal":"احتمال","context":"احتمال لحدوث شيء","type":"phrase","note":"صيغة للتوقع."}]},{"id":"second-key","title":"The Second Key","genre":"psychological","level":"C1","subtitle":"A home you never owned.","description":"An architect receives a key to a house whose floor plan matches her recurring dream.","cover":"editorial","chapters":[{"title":"Blueprints","titleAr":"المخططات","paragraphs":[{"en":"For seven years, Iris had dreamed of a house with two staircases and no front door.","ar":"منذ سبع سنوات، كانت آيريس تحلم بمنزل فيه درجان ولا باب أمامي."},{"en":"She never mentioned the dream until a stranger delivered a key wrapped in one of her own architectural drawings.","ar":"لم تذكر الحلم لأحد حتى سلّمها غريب مفتاحًا ملفوفًا بإحدى رسوماتها المعمارية."},{"en":"The drawing was dated next month. In the corner, in her handwriting, were the words: Do not build the second staircase.","ar":"كان تاريخ الرسم الشهر المقبل. وفي الزاوية، بخطها، كُتبت عبارة: لا تبني الدرج الثاني."},{"en":"Iris went to the address on the paper. The house was there, complete and empty.","ar":"ذهبت آيريس إلى العنوان المكتوب. كان المنزل هناك، مكتملًا وخاليًا."}]},{"title":"The Lower Floor","titleAr":"الطابق السفلي","paragraphs":[{"en":"The key opened a side door. Inside, every room contained a drawing of the room beside it.","ar":"فتح المفتاح بابًا جانبيًا. في الداخل، احتوت كل غرفة على رسم للغرفة المجاورة."},{"en":"At the foot of the first staircase stood a little desk covered in sketches of visitors who had not yet arrived.","ar":"عند أسفل الدرج الأول، كان مكتب صغير تعلوه رسوم لأشخاص لم يصلوا بعد."},{"en":"Iris recognized her younger self among them, holding a second key.","ar":"تعرّفت بين الرسوم إلى نفسها وهي أصغر سنًا وتحمل مفتاحًا ثانيًا."},{"en":"A note said: Every time you remember the house, it remembers you.","ar":"قالت ملاحظة: في كل مرة تتذكرين فيها المنزل، يتذكرك هو أيضًا."}]},{"title":"One Staircase","titleAr":"درج واحد","paragraphs":[{"en":"She returned to the drawing board and crossed out the second staircase. A wall trembled somewhere above her.","ar":"عادت إلى لوحة الرسم وشطبت الدرج الثاني. اهتز جدار في مكان ما فوقها."},{"en":"The sketches changed. The visitors vanished, leaving only one woman at the front door.","ar":"تبدلت الرسوم، واختفى الزوار، ولم يبق إلا امرأة تقف عند الباب الأمامي."},{"en":"Iris climbed the remaining stairs. The door led onto the street where she had grown up.","ar":"صعدت آيريس الدرج الباقي. فتح الباب على الشارع الذي نشأت فيه."},{"en":"She stepped outside before the house could persuade her that she had never left.","ar":"خرجت قبل أن يقنعها المنزل بأنها لم تغادره يومًا."}]}],"terms":[{"term":"floor plan","literal":"مخطط الطابق","context":"رسم يوضح توزيع غرف المنزل","type":"noun","note":"مصطلح هندسي."},{"term":"in her handwriting","literal":"بخط يدها","context":"العبارة مكتوبة بخطها الشخصي","type":"phrase","note":"وصف للوثائق."},{"term":"at the foot of","literal":"عند أسفل","context":"عند قاعدة الدرج","type":"phrase","note":"وصف مكاني شائع."},{"term":"crossed out","literal":"شطب","context":"ألغت جزءًا من الرسم بخط فوقه","type":"phrasal verb","note":"للتعديل على النص أو الرسم."}]},{"id":"observatory-fire","title":"The Observatory Fire","genre":"historical","level":"B2","subtitle":"Some stars were never recorded.","description":"In the 1890s an astronomer discovers an erased comet in the night before an observatory burns.","cover":"editorial","chapters":[{"title":"Unwritten Stars","titleAr":"نجوم لم تُسجّل","paragraphs":[{"en":"In 1894, young astronomer Samira cleaned lenses and copied measurements at a hilltop observatory.","ar":"في عام 1894، كانت الفلكية الشابة سميرة تنظف العدسات وتنسخ القياسات في مرصد فوق تلة."},{"en":"The director permitted her to observe but refused to publish her discoveries under her own name.","ar":"سمح لها المدير بالرصد، لكنه رفض نشر اكتشافاتها باسمها."},{"en":"One winter evening she found an empty page where the records of a strange comet should have been.","ar":"ذات مساء شتوي، وجدت صفحة فارغة في موضع كان يجب أن تظهر فيه سجلات مذنب غريب."},{"en":"Beneath the paper she discovered a faint pencil mark: It returns tonight.","ar":"تحت الورقة اكتشفت أثر قلم رصاص باهتًا: سيعود الليلة."}]},{"title":"A Light on the Hill","titleAr":"ضوء فوق التلة","paragraphs":[{"en":"Samira trained the telescope on the eastern sky and saw the comet, brighter than the director had claimed.","ar":"وجهت سميرة المنظار نحو الشرق، فرأت المذنب أشد سطوعًا مما قال المدير."},{"en":"The director entered carrying a lantern. He ordered her to hand over the notebook.","ar":"دخل المدير حاملًا مصباحًا، وأمرها بتسليم دفتر الملاحظات."},{"en":"As she refused, the lantern fell and flames raced along the old timber shelves.","ar":"وحين رفضت، سقط المصباح وامتدت النيران بسرعة على الرفوف الخشبية القديمة."},{"en":"She could save the instruments or the notebook, but not both. She chose the notebook.","ar":"كان بوسعها إنقاذ الأجهزة أو الدفتر، لا الاثنين. فاختارت الدفتر."}]},{"title":"The Public Sky","titleAr":"سماء للجميع","paragraphs":[{"en":"At sunrise the observatory stood black against the snow. The director blamed the fire on an accident.","ar":"عند الشروق، بدا المرصد أسود وسط الثلج. وألقى المدير اللوم على حادث عرضي."},{"en":"Samira carried her notes to a newspaper office and described what she had seen.","ar":"حملت سميرة ملاحظاتها إلى صحيفة ووصفت ما رأته."},{"en":"Within weeks, observatories across the country confirmed the comet. Her name appeared beside it in print.","ar":"خلال أسابيع أكدت مراصد في أنحاء البلاد وجود المذنب. وظهر اسمها مطبوعًا إلى جانبه."},{"en":"She missed the old telescope. She did not miss asking permission to look at the stars.","ar":"افتقدت المنظار القديم، لكنها لم تفتقد الحاجة إلى استئذان أحد كي تنظر إلى النجوم."}]}],"terms":[{"term":"under her own name","literal":"باسمها الشخصي","context":"أن يُنسب الاكتشاف إليها","type":"phrase","note":"عن نسب الفضل للمكتشف."},{"term":"faint pencil mark","literal":"أثر قلم باهت","context":"كتابة بالكاد تُرى","type":"collocation","note":"في وصف الوثائق."},{"term":"hand over","literal":"يسلّم","context":"يسلّم الدفتر لشخص آخر","type":"phrasal verb","note":"قد ينطوي على سلطة أو إلزام."},{"term":"in print","literal":"مطبوعًا","context":"منشورًا في الصحيفة","type":"idiom","note":"لما يظهر في منشور رسمي."}]},{"id":"desk-seven","title":"Nobody at Desk Seven","genre":"contemporary","level":"B2","subtitle":"The empty chair is not empty.","description":"A new employee discovers why a company keeps an empty desk on its payroll.","cover":"editorial","chapters":[{"title":"An Unoccupied Desk","titleAr":"مكتب لا يجلس عليه أحد","paragraphs":[{"en":"On her first day, Dana noticed that everyone avoided desk seven. It had a computer, a lamp, and a fresh cup of tea.","ar":"في يوم عملها الأول، لاحظت دانا أن الجميع يتجنب المكتب السابع. كانت عليه حاسوب ومصباح وكوب شاي طازج."},{"en":"The team manager insisted the desk belonged to an employee working remotely.","ar":"أصرّ مدير الفريق على أن المكتب لموظف يعمل عن بعد."},{"en":"Yet nobody knew the employee's name. In meetings, an extra vote appeared in the minutes.","ar":"لكن لم يعرف أحد اسم الموظف. وفي محاضر الاجتماعات كان يظهر صوت إضافي عند التصويت."},{"en":"Dana found a staff photograph. Someone had carefully cut one person out.","ar":"وجدت دانا صورة للموظفين، وقد قُصّ منها شخص بعناية."}]},{"title":"The Extra Vote","titleAr":"الصوت الإضافي","paragraphs":[{"en":"She checked archived reports and found that desk seven had consistently voted against layoffs.","ar":"راجعت التقارير القديمة، فوجدت أن صاحب المكتب السابع كان يصوّت دائمًا ضد الاستغناء عن الموظفين."},{"en":"The seat had belonged to a whistleblower who had disappeared after reporting unsafe working conditions.","ar":"كان المقعد يعود إلى شخص كشف مخالفات ثم اختفى بعد الإبلاغ عن ظروف عمل غير آمنة."},{"en":"A group of colleagues had kept the account active so the complaints could not be quietly deleted.","ar":"أبقى زملاء له الحساب نشطًا حتى لا تختفي الشكاوى بصمت."},{"en":"Dana read the reports and understood that the empty chair was a form of protest.","ar":"قرأت دانا التقارير وفهمت أن المقعد الفارغ كان شكلًا من أشكال الاحتجاج."}]},{"title":"A Real Name","titleAr":"اسم حقيقي","paragraphs":[{"en":"She requested a meeting and placed the reports on the table. The manager said it was time to move on.","ar":"طلبت اجتماعًا ووضعت التقارير على الطاولة. قال المدير إن الوقت حان لتجاوز الماضي."},{"en":"Dana asked whether moving on meant forgetting the people who had been hurt.","ar":"سألته دانا: وهل تجاوز الماضي يعني نسيان من تعرضوا للأذى؟"},{"en":"The team voted to publish the findings and create a permanent safety committee.","ar":"صوّت الفريق لنشر النتائج وتشكيل لجنة دائمة للسلامة."},{"en":"The next morning, desk seven held a new nameplate: Speak Up.","ar":"في الصباح التالي، وُضعت لوحة اسم جديدة على المكتب السابع: تكلّم ولا تصمت."}]}],"terms":[{"term":"working remotely","literal":"يعمل عن بعد","context":"يؤدي عمله خارج المكتب","type":"phrase","note":"شائع في العمل الحديث."},{"term":"in the minutes","literal":"في المحضر","context":"ضمن محضر الاجتماع الرسمي","type":"idiom","note":"minutes هنا تعني المحضر لا الدقائق."},{"term":"whistleblower","literal":"مبلّغ عن مخالفة","context":"شخص يكشف فسادًا أو تجاوزات","type":"noun","note":"مصطلح قانوني ومهني."},{"term":"move on","literal":"يتجاوز","context":"ينتقل لما بعد الأزمة","type":"phrasal verb","note":"قد يُستخدم لتجاهل مشكلة أيضًا."}]},{"id":"bell-beneath-lake","title":"The Bell Beneath the Lake","genre":"horror","level":"B2","subtitle":"It rings only when someone lies.","description":"A diver investigates a bell that tolls beneath a reservoir every winter, despite there being no church.","cover":"editorial","chapters":[{"title":"Winter Sound","titleAr":"صوت الشتاء","paragraphs":[{"en":"Every January, the reservoir made a single clear ringing sound at midnight. The village had learned not to ask why.","ar":"في كل يناير، كانت البحيرة الاصطناعية تصدر رنينًا واضحًا واحدًا عند منتصف الليل. وتعلّم أهل القرية ألا يسألوا عن السبب."},{"en":"When her father disappeared, Lina borrowed diving equipment and went to the shore.","ar":"عندما اختفى والدها، استعارت لينا معدات غوص وتوجهت إلى الشاطئ."},{"en":"The water was black and still. Beneath the ice she saw stone steps descending toward a tower.","ar":"كانت المياه سوداء ساكنة. وتحت الجليد رأت درجًا حجريًا ينزل نحو برج."},{"en":"There had never been a tower on any map of the valley.","ar":"لم يظهر أي برج في خرائط الوادي يومًا."}]},{"title":"The Dry Tower","titleAr":"البرج الجاف","paragraphs":[{"en":"Lina descended until the sound of her own breathing was louder than the water.","ar":"نزلت لينا حتى صار صوت أنفاسها أعلى من صوت المياه حولها."},{"en":"Inside the tower, the floor was completely dry. A bell hung above a book of names.","ar":"داخل البرج كانت الأرض جافة تمامًا. عُلّق جرس فوق كتاب أسماء."},{"en":"Her father's name appeared beside the words: I never went into the lake.","ar":"ظهر اسم والدها بجانب عبارة: لم أدخل البحيرة قط."},{"en":"The bell rang once, although nobody had touched it. Dust fell from the ceiling like pale snow.","ar":"رن الجرس مرة واحدة رغم أن أحدًا لم يلمسه. وتساقط الغبار من السقف كالثلج الشاحب."}]},{"title":"An Honest Answer","titleAr":"إجابة صادقة","paragraphs":[{"en":"A voice asked Lina why she had come. She almost answered that she wanted to save her father.","ar":"سألها صوت لماذا جاءت. كادت تجيب بأنها تريد إنقاذ والدها."},{"en":"But she had come because she feared he had chosen to leave. She spoke the truth.","ar":"لكنها جاءت لأنها خافت أنه اختار الرحيل. فقالت الحقيقة."},{"en":"The bell remained silent. A doorway opened onto the shore, and there stood her father, old and frightened.","ar":"بقي الجرس صامتًا. انفتح باب نحو الشاطئ، وكان والدها يقف هناك، وقد بدا مسنًا وخائفًا."},{"en":"Neither asked what the tower had shown the other. Some silences, Lina thought, were merciful.","ar":"لم يسأل أي منهما الآخر عما كشفه له البرج. فكرت لينا أن بعض الصمت رحمة."}]}],"terms":[{"term":"reservoir","literal":"خزان مياه / بحيرة اصطناعية","context":"بحيرة صناعية لتجميع المياه","type":"noun","note":"ليس أي بحيرة طبيعية."},{"term":"tolls","literal":"يقرع","context":"صوت الجرس العميق","type":"verb","note":"لجرس الكنيسة أو التحذير."},{"term":"almost answered","literal":"كاد أن يجيب","context":"كان على وشك قول جواب ثم توقف","type":"phrase","note":"almost قبل الفعل."},{"term":"remained silent","literal":"ظل صامتًا","context":"لم يصدر صوتًا بعد اعترافها","type":"collocatio
