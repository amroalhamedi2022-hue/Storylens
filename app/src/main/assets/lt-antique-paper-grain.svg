<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
<!-- Static, locally bundled parchment grain; NEVER applied as a filter to original historical image pixels. -->
<defs><filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="17" stitchTiles="stitch" result="noise"/>
<feColorMatrix in="noise" type="matrix" values="0 0 0 0 .48  0 0 0 0 .29  0 0 0 0 .12  0 0 0 .16 -.065"/>
</filter></defs>
<rect width="192" height="192" filter="url(#fibres)"/>
</svg>
