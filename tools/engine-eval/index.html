<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingua Tales — isolated page-flip engine comparison</title>
<link rel="stylesheet" href="./vendor/openpageflip.css">
<style>
:root{color-scheme:light;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 10%,#293c53,#111e30);min-height:100vh;color:#f6f5ed}
header{padding:12px 4vw;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.15rem;margin:0 16px 0 0}
header a{color:#d9ecef}
main{margin:auto;max-width:1100px;padding:6px 12px 40px}
#status{font:13px/1.4 ui-monospace,monospace;min-height:24px;color:#dce3ec;text-align:center}
#book{width:100%;max-width:940px;min-height:560px;margin:6px auto 0;position:relative;isolation:isolate;touch-action:pan-y}
.paper{background:#f8f3e4;color:#2d291e;border:1px solid #d9c9aa;
 box-shadow:inset 0 0 48px rgba(119,89,46,.09);padding:26px 23px 40px;
 font-family:Georgia,'Times New Roman',serif;overflow:hidden;line-height:1.55}
.paper[dir=rtl]{font-family:'Noto Naskh Arabic',Georgia,serif;text-align:right}
.paper h2{font-size:15px;margin:0 0 15px;color:#766245}
.paper p{font-size:17px;line-height:1.6;margin:0 0 12px}
.paper[dir=rtl] p{font-size:19px;line-height:1.9}
.paper button{padding:6px 12px;border-radius:7px;border:1px solid #99784c;color:#322515;background:#eee0bc;cursor:pointer}
.paper footer{font-size:12px;text-align:center;color:#887451;padding-top:8px}
#word-sheet{font:14px/1.4 system-ui;background:#fff5d0;color:#33290e;border-radius:10px;padding:8px;margin:8px auto;max-width:440px;min-height:34px;text-align:center}
#details{font:12px/1.5 ui-monospace,monospace;color:#d3d8e1;margin:auto;max-width:940px}
@media (max-width:560px){.paper{padding:20px 15px 35px}#book{max-width:460px;min-height:540px}}
</style>
</head>
<body>
<header>
<h1>Lingua Tales • Independent engine evaluation</h1>
<a href="?engine=st&rtl=0">StPageFlip LTR</a>
<a href="?engine=open&rtl=0">OpenPageFlip LTR</a>
<a href="?engine=open&rtl=1">OpenPageFlip RTL</a>
<a href="?engine=open&rtl=1&grab=anywhere">OpenPageFlip free-grab RTL</a>
</header>
<main>
<div id="status">Preparing offline book…</div>
<div id="book" aria-label="Isolated literary page flip"></div>
<div id="word-sheet" role="status">Tap the highlighted word to check text interactivity.</div>
<pre id="details"></pre>
</main>
<script src="../../app/src/main/assets/classic-verne-towle-ch01.js"></script>
<script src="./vendor/stpageflip.js"></script>
<script src="./vendor/openpageflip.js"></script>
<script src="./demo.js"></script>
</body></html>
